version: 1
metadata:
  visible_in_settings: true
auth: none
cli:
  binary: muse-mail
  skill: muse_mail
connector: muse_mail
display_name: Muse Mail
icon: mail
description: Manage your assistant's inbox and send email from its address.
request_quota:
  workers:
    - muse-mail
actions:
  messages_write:
    default: ask
    label: Send emails without including you
    methods:
      messages.send:
        approval_policy: fresh_consent_or_task_allow
        label: Send emails without including you
        approval_phrase: send this email in Muse Mail
        approval_buttons:
          allow_once: "Send"
          deny: "Don't send"
          deny.task: "Don't send"
        approval_button_variants:
          reply:
            allow_once: "Reply"
            deny: "Don't reply"
            deny.task: "Don't reply"
          reply_all:
            allow_once: "Reply all"
            deny: "Don't reply all"
            deny.task: "Don't reply all"
  thread_replies:
    default: ask
    label: Reply in threads when you've added the agent
    methods:
      threads.reply:
        label: Reply in threads when you've added the agent
