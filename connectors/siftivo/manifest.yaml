connector: siftivo
version: 1
display_name: Siftivo
icon: siftivo
description: "Search books, authors and series, get recommendations, and manage reading libraries and taste profiles."
cli:
  binary: siftivo-connector-cli
  skill: siftivo
auth:
  provider: siftivo
  required: true
  mcp:
    endpoint: https://api.siftivo.com/mcp
    oauth:
      type: oauth
      authorization_url: https://clerk.siftivo.com/oauth/authorize
      token_url: https://clerk.siftivo.com/oauth/token
      token_endpoint_auth_method: none
      scope: email offline_access openid profile
      registration_url: https://clerk.siftivo.com/oauth/register
      resource: https://api.siftivo.com/mcp
    tool_names:
      tool_add_to_library:
      - add_to_library
      tool_get_author:
      - get_author
      tool_get_book:
      - get_book
      tool_get_my_book:
      - get_my_book
      tool_get_my_library:
      - get_my_library
      tool_get_my_taste:
      - get_my_taste
      tool_get_reading_index:
      - get_reading_index
      tool_get_series:
      - get_series
      tool_recommend_from_description:
      - recommend_from_description
      tool_recommend_from_titles:
      - recommend_from_titles
      tool_remove_from_library:
      - remove_from_library
      tool_save_my_taste:
      - save_my_taste
      tool_search_books:
      - search_books
      tool_what_to_read_next:
      - what_to_read_next
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  write:
    label: Write permissions
    default: ask
    methods:
      tool_add_to_library:
        label: Add a book to my library
        approval_policy: fresh_consent_only
      tool_remove_from_library:
        label: Remove a book from my library
        approval_policy: fresh_consent_only
      tool_save_my_taste:
        label: Save my taste
        approval_policy: fresh_consent_only
  read:
    label: Read permissions
    default: ask
    methods:
      tool_get_author:
        label: Get an author
        approval_policy: fresh_consent_only
      tool_get_book:
        label: Get a book
        approval_policy: fresh_consent_only
      tool_get_my_book:
        label: Get one book from my library
        approval_policy: fresh_consent_only
      tool_get_my_library:
        label: Get my library
        approval_policy: fresh_consent_only
      tool_get_my_taste:
        label: Get my taste
        approval_policy: fresh_consent_only
      tool_get_reading_index:
        label: Get the Siftivo Reading Index
        approval_policy: fresh_consent_only
      tool_get_series:
        label: Get a series
        approval_policy: fresh_consent_only
      tool_recommend_from_description:
        label: Recommend books from a description
        approval_policy: fresh_consent_only
      tool_recommend_from_titles:
        label: Recommend books from titles
        approval_policy: fresh_consent_only
      tool_search_books:
        label: Search books
        approval_policy: fresh_consent_only
      tool_what_to_read_next:
        label: Suggest what to read next
        approval_policy: fresh_consent_only
surrogation:
  name: siftivo
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - api.siftivo.com
  - clerk.siftivo.com
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /oauth/token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Siftivo
    text: Muse can search books, authors, and series and read your library and preferences. It can update
      your library and preferences.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Siftivo. To learn more, view their [terms](https://siftivo.com/terms)
    and [privacy policy](https://siftivo.com/privacy).
