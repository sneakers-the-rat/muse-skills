connector: movemate
version: 1
display_name: MoveMate
icon: movemate
description: "Plan and log strength workouts, browse exercises, and read training history, personal records and progress."
cli:
  binary: movemate-connector-cli
  skill: movemate
auth:
  provider: movemate
  required: true
  mcp:
    endpoint: https://api.movemate.app/mcp
    oauth:
      type: oauth
      authorization_url: https://api.movemate.app/oauth/authorize
      token_url: https://api.movemate.app/oauth/token
      token_endpoint_auth_method: none
      scope: library:read profile:read stats:read workouts:write
      registration_url: https://api.movemate.app/oauth/register
      resource: https://api.movemate.app/mcp
    tool_names:
      tool_create_custom_exercise:
      - create_custom_exercise
      tool_create_custom_workout:
      - create_custom_workout
      tool_create_planned_workout:
      - create_planned_workout
      tool_delete_planned_workout:
      - delete_planned_workout
      tool_get_body_profile:
      - get_body_profile
      tool_get_exercise_progression:
      - get_exercise_progression
      tool_get_personal_records:
      - get_personal_records
      tool_get_profile:
      - get_profile
      tool_get_recent_workouts:
      - get_recent_workouts
      tool_get_training_stats:
      - get_training_stats
      tool_get_workout:
      - get_workout
      tool_get_workout_details:
      - get_workout_details
      tool_list_planned_workouts:
      - list_planned_workouts
      tool_list_workouts:
      - list_workouts
      tool_log_completed_workouts:
      - log_completed_workouts
      tool_search_exercises:
      - search_exercises
      tool_update_custom_workout:
      - update_custom_workout
      tool_update_planned_workout:
      - update_planned_workout
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  write:
    label: Write permissions
    default: ask
    methods:
      tool_create_custom_exercise:
        label: Create custom exercise
        approval_policy: fresh_consent_only
      tool_create_custom_workout:
        label: Create saved workout
        approval_policy: fresh_consent_only
      tool_create_planned_workout:
        label: Create planned workout
        approval_policy: fresh_consent_only
      tool_delete_planned_workout:
        label: Delete planned workout
        approval_policy: fresh_consent_only
      tool_log_completed_workouts:
        label: Log completed workouts
        approval_policy: fresh_consent_only
      tool_update_custom_workout:
        label: Update saved workout
        approval_policy: fresh_consent_only
      tool_update_planned_workout:
        label: Update planned workout
        approval_policy: fresh_consent_only
  read:
    label: Read permissions
    default: ask
    methods:
      tool_get_body_profile:
        label: Get body profile
        approval_policy: fresh_consent_only
      tool_get_exercise_progression:
        label: Get exercise progression
        approval_policy: fresh_consent_only
      tool_get_personal_records:
        label: Get personal records
        approval_policy: fresh_consent_only
      tool_get_profile:
        label: Get profile
        approval_policy: fresh_consent_only
      tool_get_recent_workouts:
        label: Get recent workouts
        approval_policy: fresh_consent_only
      tool_get_training_stats:
        label: Get training stats
        approval_policy: fresh_consent_only
      tool_get_workout:
        label: Get workout
        approval_policy: fresh_consent_only
      tool_get_workout_details:
        label: Get workout details
        approval_policy: fresh_consent_only
      tool_list_planned_workouts:
        label: List planned workouts
        approval_policy: fresh_consent_only
      tool_list_workouts:
        label: List workouts
        approval_policy: fresh_consent_only
      tool_search_exercises:
        label: Search exercises
        approval_policy: fresh_consent_only
surrogation:
  name: movemate
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - api.movemate.app
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /oauth/token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with MoveMate
    text: Muse can read your body profile, workouts, stats, and personal records. It can create, log,
      schedule, or delete workouts.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - Learn more about how we use this info in our [Privacy Policy](https://muse.ai/privacy) and [Health
    Policy](https://www.facebook.com/privacy/policies/health/).
  - Muse will exchange info with MoveMate. To learn more, view their [terms](https://movemate.app/terms-of-use)
    and [privacy policy](https://movemate.app/privacy-policy).
