connector: vritto
version: 1
display_name: Vritto
icon: vritto
description: "Find, create and update tasks, notes, shopping lists, contacts, trips and other records in enabled Vritto modules. Review change proposals, get an overview, and look up public reference data."
cli:
  binary: vritto-connector-cli
  skill: vritto
auth:
  provider: vritto
  required: true
  mcp:
    endpoint: https://mcp.vritto.app/
    oauth:
      type: oauth
      authorization_url: https://mcp.vritto.app/authorize
      token_url: https://mcp.vritto.app/token
      token_endpoint_auth_method: none
      scope: vritto:modules
      cimd: true
      resource: https://mcp.vritto.app
    tool_names:
      tool_vritto_create:
      - vritto_create
      tool_vritto_delete:
      - vritto_delete
      tool_vritto_describe:
      - vritto_describe
      tool_vritto_find:
      - vritto_find
      tool_vritto_lookup:
      - vritto_lookup
      tool_vritto_overview:
      - vritto_overview
      tool_vritto_proposals_list:
      - vritto_proposals_list
      tool_vritto_proposals_respond:
      - vritto_proposals_respond
      tool_vritto_undo:
      - vritto_undo
      tool_vritto_update:
      - vritto_update
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  write:
    label: Write permissions
    default: ask
    methods:
      tool_vritto_create:
        label: Add Vritto records
        approval_policy: fresh_consent_only
      tool_vritto_delete:
        label: Delete Vritto records
        approval_policy: fresh_consent_only
      tool_vritto_proposals_respond:
        label: Decide a Vritto review item
        approval_policy: fresh_consent_only
      tool_vritto_undo:
        label: Undo a Vritto change
        approval_policy: fresh_consent_only
      tool_vritto_update:
        label: Change Vritto records
        approval_policy: fresh_consent_only
  read:
    label: Read permissions
    default: ask
    methods:
      tool_vritto_describe:
        label: Explain Vritto records
        approval_policy: fresh_consent_only
      tool_vritto_find:
        label: Find Vritto records
        approval_policy: fresh_consent_only
      tool_vritto_lookup:
        label: Look up reference data
        approval_policy: fresh_consent_only
      tool_vritto_overview:
        label: Get today's overview
        approval_policy: fresh_consent_only
      tool_vritto_proposals_list:
        label: List Vritto review items
        approval_policy: fresh_consent_only
surrogation:
  name: vritto
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - mcp.vritto.app
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Vritto
    text: Muse can read, create, change, or delete records in Vritto modules you enable, including health
      and financial records.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - Learn more about how we use this info in our [Privacy Policy](https://muse.ai/privacy) and [Health
    Policy](https://www.facebook.com/privacy/policies/health/).
  - Muse will exchange info with Vritto. To learn more, view their [terms](https://vritto.app/terms) and
    [privacy policy](https://vritto.app/privacy).
