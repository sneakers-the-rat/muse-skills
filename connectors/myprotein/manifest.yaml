version: 1
gating:
  allowed_countries:
    default:
    - GB
    exempt_vm_channels:
    - prod
    - quail
    - canary
    - internal-test
    - external-connectors-test
metadata:
  visible_in_settings: true
connector: myprotein
display_name: MYPROTEIN
icon: myprotein
description: Search MYPROTEIN, manage your basket and wishlist, and check orders and rewards
request_quota:
  # THG allows 200 requests per user per minute. A full bucket plus a
  # minute of refill stays at 190, under that limit.
  mode: enforce
  workers:
  - myprotein
  queries_per_minute: 170
  burst: 20
cli:
  binary: myprotein
  skill: myprotein
auth:
  provider: myprotein
  required: true
  mcp:
    endpoint: https://myprotein-en.api.thehut.net/mcp
    protocol_version: '2025-11-25'
    oauth:
      type: oauth
      authorization_url: https://myprotein-en.api.thehut.net/mcp/oauth/authorize
      token_url: https://myprotein-en.api.thehut.net/mcp/oauth/token
      registration_url: https://myprotein-en.api.thehut.net/mcp/oauth/register
      revoke_url: https://myprotein-en.api.thehut.net/mcp/oauth/token
      revoke_on_disconnect: true
      resource: https://myprotein-en.api.thehut.net/mcp
      scope: account.read basket.write wishlist.write orders.write subscriptions.write offline_access
      token_endpoint_auth_method: none
    tool_names:
      shopping.read:
      - search_products
      - get_product
      - get_account_summary
      - get_rewards
      - list_saved_addresses
      - list_saved_cards
      - list_orders
      - get_order
      - get_wishlist
      - suggest_restock
      - get_basket
      basket.modify:
      - add_to_basket
      - update_basket_item
      - remove_from_basket
      - apply_discount_code
      - remove_discount_code
      - reorder
      - start_checkout
      wishlist.modify:
      - add_to_wishlist
      - remove_from_wishlist
surrogation:
  name: myprotein
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
  - myprotein-en.api.thehut.net
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  stripped:
  - credentials.refresh_token
  token_refresh:
  - path: /mcp/oauth/token
actions:
  read:
    default: allow
    label: Read permissions
    response_guard: verification_codes
    methods:
      shopping.read:
        label: Search products and view your account, orders, basket and wishlist
        approval_phrase: search MYPROTEIN and view your account, orders, basket and wishlist
  write:
    default: ask
    label: Write permissions
    response_guard: verification_codes
    methods:
      basket.modify:
        label: Edit your basket and create checkout links
        approval_phrase: edit your MYPROTEIN basket or create a checkout link
      wishlist.modify:
        label: Edit your wishlist
        approval_phrase: edit your MYPROTEIN wishlist
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with MYPROTEIN
    text: Muse will access things like account details, orders, saved addresses and saved cards.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with MYPROTEIN. To learn more, view their [terms](https://www.myprotein.com/c/customer-services/terms-and-conditions/)
    and [privacy policy](https://www.myprotein.com/c/customer-services/privacy-and-security/).
