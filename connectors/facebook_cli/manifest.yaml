# Hidden clap aliases of the paths above, each mapped to the path it stands for
# (an alias of a hidden copy maps to that copy), so a call spelled with an alias
# still gets that command's tool variant. An alias of a group (`posts` for
# `post`) spells every path below it. A group with a default subcommand
# (`FacebookCliTool::default_subcommands`), under each of its spellings, maps to
# that subcommand's path. manifest_tests.rs keeps this map equal to the binary's
# aliases and defaults.
cli_subcommand_aliases:
  "pages posts": "pages posts list"
  "marketplace listings": "marketplace my-listings"
  "marketplace mylistings": "marketplace my-listings"
  "marketplace seller": "marketplace seller-info"
  "marketplace listing": "marketplace listing details"
