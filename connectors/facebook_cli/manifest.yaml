# The daemon sends this screen only on a confidential VM, the only place
# Facebook needs consent (auth.confidential_vm_consent in connector.yaml).
consent_screen:
  bullets:
    - icon: data_types
      title: "Level up with Facebook"
      text: "Muse will access things like posts, comments and friends."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  callout_title: "Non-confidential connector"
  footer_paragraphs:
    - text: "Facebook is from Meta. This means the info exchanged is visible to Meta. [Learn more](https://muse.ai/privacy)"
      placement: callout
    - "Muse will exchange info with Facebook. To learn more, view Meta's [terms](https://www.facebook.com/terms/) and [privacy policy](https://www.facebook.com/privacy/policy/)."
