actions:
  read:
    default: allow
    label: Read permissions
    methods:
      guidance:
        label: Read your account status
        approval_phrase: read your account status
        response_guard: disabled
      pages.read:
        label: Read posts and analytics from your Pages
        approval_phrase: read posts and analytics from your Facebook Pages
        response_guard: verification_codes
      pages.creator.read:
        label: Read followers, Page details, posting ideas, content protection and stories
        approval_phrase: read followers and followed profiles for you and your Facebook Pages, and your Pages' details, posting recommendations, content protection, creator guidance and stories
        response_guard: verification_codes
      pages.monetization.read:
        label: Read earnings, monetization eligibility and payouts for your Pages
        approval_phrase: read earnings, monetization eligibility and payouts for your Facebook Pages
        response_guard: verification_codes
      post.audiences.read:
        label: Read your current Facebook posting audience and choices
        approval_phrase: read your Facebook posting audience and choices
        response_guard: disabled
      post.crossposting.read:
        label: Read where your Facebook posts are also shared
        approval_phrase: read where your Facebook posts are also shared
        response_guard: disabled
      facebook.search:
        label: Search
        approval_phrase: search Facebook
  write:
    default: ask
    label: Write and delete permissions
    methods:
      post.create:
        approval_policy: fresh_consent_only
        label: Publish posts to your profile
        approval_phrase: post to your Facebook profile
      groups.posts.create_and_edit:
        approval_policy: fresh_consent_only
        label: Post and edit Groups content
        approval_phrase: post and edit Groups content
      comment.add:
        approval_policy: fresh_consent_only
        label: Add text comments and replies
        approval_phrase: add this Facebook comment or reply
      pages.posts.write:
        approval_policy: fresh_consent_only
        label: Draft, publish, or schedule page posts
        approval_phrase: create, edit, schedule, publish, and delete posts and drafts on your Facebook Pages
      pages.stories.write:
        approval_policy: fresh_consent_only
        label: Publish and delete stories on your Pages
        approval_phrase: publish and delete stories on your Facebook Pages
      pages.comments.write:
        approval_policy: fresh_consent_only
        label: Reply to, hide and delete comments on your Pages' posts
        approval_phrase: reply to, hide, and delete comments on your Facebook Pages' posts as the Page
      marketplace.listing.draft:
        label: Create draft Marketplace listings
        approval_phrase: save this Marketplace listing as a draft on Facebook
      marketplace.listing.publish:
        approval_policy: fresh_consent_only
        label: Publish Marketplace listings
        approval_phrase: publish this Marketplace listing on Facebook
      marketplace.listing.update:
        approval_policy: fresh_consent_only
        label: Update Marketplace listings
        approval_phrase: update this Marketplace listing on Facebook
      marketplace.listing.delete:
        approval_policy: fresh_consent_only
        label: Delete Marketplace listings
        approval_phrase: delete this Marketplace listing from Facebook
      groups.moderate:
        approval_policy: fresh_consent_only
        label: Manage groups that you admin or moderate
        approval_phrase: manage groups that you admin or moderate
      saved.write:
        default: allow
        label: Save items
