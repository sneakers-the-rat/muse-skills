id: facebook_cli
title: "Facebook"
description: "Read the user's Facebook friends, profiles, timelines, posts, comments, reactions, feeds, stories, groups, events and saved items, post and comment as the user, including in their Groups, approve or decline pending posts, membership requests and participation requests, and approve or delete spam in Groups they administer or moderate, report insights and publish or schedule posts on Facebook Pages they manage, with posting ideas, stories, followers, earnings and payouts, moderation and Facebook's creator and Page policies, buy and sell on Marketplace, and shop products shown in Reels."
aliases: [facebook-cli, facebook_cli, facebook-marketplace, facebook_marketplace]
wire_id: facebook
include_in_prompt: true
features:
  facebook-group-moderation:
    gk: hatch_fb_connector_group_moderation_test
    description_phrase: ", approve or decline pending posts, membership requests and participation requests, and approve or delete spam in Groups they administer or moderate"
    files: [references/groups-moderation.md]
    methods: [groups.moderate]
  facebook-group-posts:
    gk: hatch_fb_connector_media_publishing_test
    description_phrase: ", including in their Groups"
    methods: [groups.posts.create_and_edit]
  facebook-profile-media:
    gk: hatch_fb_connector_media_publishing_test
  facebook-pages-tranche2:
    gk: hatch_fb_connector_pages_tranche2
    description_phrase: ", with posting ideas, stories, followers, earnings and payouts, moderation and Facebook's creator and Page policies"
    files:
      - references/followers.md
      - references/pages-comments.md
      - references/pages-inspiration.md
      - references/pages-monetization.md
      - references/pages-rights-and-guidance.md
      - references/pages-stories.md
    methods:
      - pages.creator.read
      - pages.monetization.read
      - pages.stories.write
      - pages.comments.write
onboarding: true
non_confidential: true
availability:
  confidential_vm: true
auth:
  confidential_vm_consent: true
sync:
  fetch_kind: connector_sync_facebook_marketplace
  cadence_minutes: 60
  read_methods: [facebook.search]
