connector: estimatekit
version: 1
display_name: EstimateKit
icon: estimatekit
description: "Manage customers, draft estimates from templates and price books, and review jobs, invoices and business priorities."
cli:
  binary: estimatekit-connector-cli
  skill: estimatekit
auth:
  provider: estimatekit
  required: true
  mcp:
    endpoint: https://mcp.estimatekit.com/mcp
    oauth:
      type: oauth
      authorization_url: https://zeyrhsvuknjvbptfqfxb.supabase.co/auth/v1/oauth/authorize
      token_url: https://zeyrhsvuknjvbptfqfxb.supabase.co/auth/v1/oauth/token
      token_endpoint_auth_method: none
      scope: openid
      registration_url: https://zeyrhsvuknjvbptfqfxb.supabase.co/auth/v1/oauth/clients/register
      resource: https://mcp.estimatekit.com/mcp
    tool_names:
      tool_business_snapshot:
      - business_snapshot
      tool_create_customer:
      - create_customer
      tool_create_draft_estimate:
      - create_draft_estimate
      tool_get_customer:
      - get_customer
      tool_get_estimate:
      - get_estimate
      tool_list_estimates:
      - list_estimates
      tool_list_invoices:
      - list_invoices
      tool_list_jobs:
      - list_jobs
      tool_list_templates:
      - list_templates
      tool_search_customers:
      - search_customers
      tool_search_price_book:
      - search_price_book
      tool_update_customer:
      - update_customer
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  read:
    label: Read permissions
    default: ask
    methods:
      tool_business_snapshot:
        label: See what needs attention
        approval_policy: fresh_consent_only
      tool_get_customer:
        label: Get customer details
        approval_policy: fresh_consent_only
      tool_get_estimate:
        label: Get quote details
        approval_policy: fresh_consent_only
      tool_list_estimates:
        label: List quotes
        approval_policy: fresh_consent_only
      tool_list_invoices:
        label: List invoices
        approval_policy: fresh_consent_only
      tool_list_jobs:
        label: List jobs
        approval_policy: fresh_consent_only
      tool_list_templates:
        label: List quote templates
        approval_policy: fresh_consent_only
      tool_search_customers:
        label: Find customers
        approval_policy: fresh_consent_only
      tool_search_price_book:
        label: Search the price book
        approval_policy: fresh_consent_only
  write:
    label: Write permissions
    default: ask
    methods:
      tool_create_customer:
        label: Add a customer
        approval_policy: fresh_consent_only
      tool_create_draft_estimate:
        label: Draft a quote
        approval_policy: fresh_consent_only
      tool_update_customer:
        label: Update a customer
        approval_policy: fresh_consent_only
surrogation:
  name: estimatekit
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - mcp.estimatekit.com
  - zeyrhsvuknjvbptfqfxb.supabase.co
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /auth/v1/oauth/token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with EstimateKit
    text: Muse can read your customers, estimates, invoices, jobs, and price book. It can update customers
      and draft estimates.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with EstimateKit. To learn more, view their [terms](https://estimatekit.com/terms)
    and [privacy policy](https://estimatekit.com/privacy-policy).
