version: 1
gating:
  allowed_countries:
    default: [CA]
    exempt_vm_channels: [internal-test, external-connectors-test, prod, quail, canary]
metadata:
  visible_in_settings: true
auth:
  client_id: "f21ba82d699b49eab56e80643682afa7"
  provider: pcexpress
  required: true
  mcp:
    endpoint: https://api.pcexpress.ca/v1/agents/mcp
    protocol_version: "2025-03-26"
    headers:
      X-Client-ID: "f21ba82d699b49eab56e80643682afa7"
    oauth:
      type: oauth
      authorization_url: https://accounts.pcid.ca/oauth2/v1/authorize
      token_url: https://accounts.pcid.ca/oauth2/v1/token
      resource: https://api.pcexpress.ca/v1/agents/mcp
      scope: openid api.loblaw.digitalagentic-shop offline_access
      token_endpoint_auth_method: none
    tool_names:
      stores.read: [search_for_stores]
      cart.prepare: [create_cart, search_for_products]
      myshop.read: [get_myshop_products]
      cart.read: [get_cart]
      cart.add: [add_products_to_cart]
      cart.modify: [update_products_in_cart, remove_products_from_cart]
      cart.clear: [clear_cart]
connector: pcexpress
display_name: PCExpress
icon: pcexpress
shopping:
  cart: true
  checkout: handoff
  cart_checkout: true
description: Find groceries and prepare a PCExpress cart
cli:
  binary: pcexpress
  skill: pcexpress
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      mcp.catalog:
        label: Read supported PCExpress tool schemas
        response_guard: disabled
      stores.read:
        label: Find stores
        response_guard: disabled
      cart.read:
        label: View the cart
        response_guard: disabled
  write:
    default: ask
    label: Write and delete permissions
    methods:
      cart.prepare:
        default: allow
        label: Prepare an account cart and search products
      myshop.read:
        default: allow
        label: Use personalized MyShop products and prepare a cart
      cart.modify:
        label: Update or remove cart items
      cart.add:
        default: allow
        label: Add products to the cart
      cart.clear:
        label: Remove all cart items
        approval_policy: fresh_consent_only
commands:
  status: null
  authorize-url: null
  refresh: null
  disconnect: null
  exchange-code: null
  list-tools: mcp.catalog
  call-tool: null
  cart-snapshot: cart.read
  add-to-cart: cart.add
consent_screen:
  bullets:
    - icon: data_types
      title: "Shop with PCExpress"
      text: "Muse will access things like nearby stores, products and your account and cart details."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with PCExpress. To learn more, view their [terms](https://www.loblaw.ca/en/legal/) and [privacy policy](https://www.loblaw.ca/en/privacy-policy/)."
