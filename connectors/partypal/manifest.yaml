connector: partypal
version: 1
display_name: PartyPal
icon: partypal
description: "Plan parties, create invitations, track guest responses, budgets and tasks, and find local vendors."
cli:
  binary: partypal-connector-cli
  skill: partypal
auth:
  provider: partypal
  required: true
  mcp:
    endpoint: https://partypal.social/api/mcp
    oauth:
      type: oauth
      authorization_url: https://partypal.social/oauth/authorize
      token_url: https://partypal.social/api/oauth/token
      token_endpoint_auth_method: none
      scope: parties
      registration_url: https://partypal.social/api/oauth/register
      resource: https://partypal.social/api/mcp
    tool_names:
      tool_add_expense:
      - add_expense
      tool_add_guests:
      - add_guests
      tool_add_task:
      - add_task
      tool_add_to_calendar:
      - add_to_calendar
      tool_buy_credits:
      - buy_credits
      tool_cancel_event:
      - cancel_event
      tool_check_image_upload:
      - check_image_upload
      tool_complete_task:
      - complete_task
      tool_create_event:
      - create_event
      tool_create_party_with_invite:
      - create_party_with_invite
      tool_create_poll:
      - create_poll
      tool_draft_vendor_messages:
      - draft_vendor_messages
      tool_generate_brief:
      - generate_brief
      tool_generate_invite_cover:
      - generate_invite_cover
      tool_generate_theme:
      - generate_theme
      tool_get_bring_list:
      - get_bring_list
      tool_get_budget:
      - get_budget
      tool_get_cakes:
      - get_cakes
      tool_get_day_of_schedule:
      - get_day_of_schedule
      tool_get_diy_kit:
      - get_diy_kit
      tool_get_event_overview:
      - get_event_overview
      tool_get_gift_ideas:
      - get_gift_ideas
      tool_get_guest_summary:
      - get_guest_summary
      tool_get_invitation:
      - get_invitation
      tool_get_invitation_bring_list:
      - get_invitation_bring_list
      tool_get_my_rsvp:
      - get_my_rsvp
      tool_get_partner_code:
      - get_partner_code
      tool_get_party_assessment:
      - get_party_assessment
      tool_get_run_of_show:
      - get_run_of_show
      tool_get_theme:
      - get_theme
      tool_get_theme_ideas:
      - get_theme_ideas
      tool_list_events:
      - list_events
      tool_list_invitations:
      - list_invitations
      tool_list_partner_offers:
      - list_partner_offers
      tool_list_polls:
      - list_polls
      tool_list_rsvp_details:
      - list_rsvp_details
      tool_list_tasks:
      - list_tasks
      tool_list_vendors:
      - list_vendors
      tool_party_calendar:
      - party_calendar
      tool_preview_party_invite:
      - preview_party_invite
      tool_propose_guest_email:
      - propose_guest_email
      tool_propose_vendor_brief:
      - propose_vendor_brief
      tool_publish_invite:
      - publish_invite
      tool_read_invitation:
      - read_invitation
      tool_reinstate_event:
      - reinstate_event
      tool_render_invite_cover:
      - render_invite_cover
      tool_rsvp_to_invitation:
      - rsvp_to_invitation
      tool_save_vendor:
      - save_vendor
      tool_search_vendors:
      - search_vendors
      tool_set_cover_photo:
      - set_cover_photo
      tool_set_invite_cover:
      - set_invite_cover
      tool_set_task_times:
      - set_task_times
      tool_set_theme:
      - set_theme
      tool_share_invite:
      - share_invite
      tool_start_image_upload:
      - start_image_upload
      tool_trash_event:
      - trash_event
      tool_update_event:
      - update_event
      tool_whoami:
      - whoami
    protocol_version: '2025-06-18'
metadata:
  visible_in_settings: true
actions:
  write:
    label: Write permissions
    default: ask
    methods:
      tool_add_expense:
        label: Record an expense
        approval_policy: fresh_consent_only
      tool_add_guests:
        label: Add guests to the list
        approval_policy: fresh_consent_only
      tool_add_task:
        label: Add a checklist task
        approval_policy: fresh_consent_only
      tool_buy_credits:
        label: Get a link to buy event credits
        approval_policy: fresh_consent_only
      tool_cancel_event:
        label: Cancel the party
        approval_policy: fresh_consent_only
      tool_complete_task:
        label: Tick off a task
        approval_policy: fresh_consent_only
      tool_create_event:
        label: Plan a new party
        approval_policy: fresh_consent_only
      tool_create_party_with_invite:
        label: Create the party and publish its invitation
        approval_policy: fresh_consent_only
      tool_create_poll:
        label: Create a guest poll
        approval_policy: fresh_consent_only
      tool_generate_invite_cover:
        label: Paint a cover with PartyPal's AI
        approval_policy: fresh_consent_only
      tool_generate_theme:
        label: Generate the theme board, pictures and cakes
        approval_policy: fresh_consent_only
      tool_get_partner_code:
        label: Claim a partner discount code
        approval_policy: fresh_consent_only
      tool_propose_guest_email:
        label: Draft an email to the guests
        approval_policy: fresh_consent_only
      tool_propose_vendor_brief:
        label: Draft a brief for a vendor
        approval_policy: fresh_consent_only
      tool_publish_invite:
        label: Publish the invitation
        approval_policy: fresh_consent_only
      tool_reinstate_event:
        label: Reinstate a cancelled party
        approval_policy: fresh_consent_only
      tool_render_invite_cover:
        label: Draw a designed invitation
        approval_policy: fresh_consent_only
      tool_rsvp_to_invitation:
        label: Answer an invitation
        approval_policy: fresh_consent_only
      tool_save_vendor:
        label: Save a vendor to the party
        approval_policy: fresh_consent_only
      tool_set_cover_photo:
        label: Set the party’s cover photo
        approval_policy: fresh_consent_only
      tool_set_invite_cover:
        label: Put an image on the invitation
        approval_policy: fresh_consent_only
      tool_set_task_times:
        label: Change task times on the day-of schedule
        approval_policy: fresh_consent_only
      tool_set_theme:
        label: Set the party theme
        approval_policy: fresh_consent_only
      tool_start_image_upload:
        label: Get a link to upload an image to the invitation
        approval_policy: fresh_consent_only
      tool_trash_event:
        label: Move the party to trash
        approval_policy: fresh_consent_only
      tool_update_event:
        label: Change party details
        approval_policy: fresh_consent_only
  read:
    label: Read permissions
    default: ask
    methods:
      tool_add_to_calendar:
        label: Get a calendar file for a party
        approval_policy: fresh_consent_only
      tool_check_image_upload:
        label: Check an image upload
        approval_policy: fresh_consent_only
      tool_draft_vendor_messages:
        label: Draft messages to vendors
        approval_policy: fresh_consent_only
      tool_generate_brief:
        label: Draft a vendor brief
        approval_policy: fresh_consent_only
      tool_get_bring_list:
        label: Get the bring list
        approval_policy: fresh_consent_only
      tool_get_budget:
        label: Get the budget
        approval_policy: fresh_consent_only
      tool_get_cakes:
        label: Get cake designs
        approval_policy: fresh_consent_only
      tool_get_day_of_schedule:
        label: Get the day-of schedule
        approval_policy: fresh_consent_only
      tool_get_diy_kit:
        label: Get the DIY party toolkit
        approval_policy: fresh_consent_only
      tool_get_event_overview:
        label: Get the party overview
        approval_policy: fresh_consent_only
      tool_get_gift_ideas:
        label: Get gift ideas
        approval_policy: fresh_consent_only
      tool_get_guest_summary:
        label: Get guest RSVPs
        approval_policy: fresh_consent_only
      tool_get_invitation:
        label: Get the invitation
        approval_policy: fresh_consent_only
      tool_get_invitation_bring_list:
        label: See what to bring
        approval_policy: fresh_consent_only
      tool_get_my_rsvp:
        label: Get your RSVP
        approval_policy: fresh_consent_only
      tool_get_party_assessment:
        label: Check how the party is going
        approval_policy: fresh_consent_only
      tool_get_run_of_show:
        label: Get the party-day schedule
        approval_policy: fresh_consent_only
      tool_get_theme:
        label: Get the theme and moodboard
        approval_policy: fresh_consent_only
      tool_get_theme_ideas:
        label: Get theme ideas
        approval_policy: fresh_consent_only
      tool_list_events:
        label: List your parties
        approval_policy: fresh_consent_only
      tool_list_invitations:
        label: List your invitations
        approval_policy: fresh_consent_only
      tool_list_partner_offers:
        label: List partner discounts
        approval_policy: fresh_consent_only
      tool_list_polls:
        label: List guest polls
        approval_policy: fresh_consent_only
      tool_list_rsvp_details:
        label: List RSVP details
        approval_policy: fresh_consent_only
      tool_list_tasks:
        label: List checklist tasks
        approval_policy: fresh_consent_only
      tool_list_vendors:
        label: List saved vendors
        approval_policy: fresh_consent_only
      tool_party_calendar:
        label: List every party you host or attend
        approval_policy: fresh_consent_only
      tool_preview_party_invite:
        label: Show the party's invitation
        approval_policy: fresh_consent_only
      tool_read_invitation:
        label: Read an invitation (Evite, Paperless Post, a card)
        approval_policy: fresh_consent_only
      tool_search_vendors:
        label: Find local vendors
        approval_policy: fresh_consent_only
      tool_share_invite:
        label: Get the invite / RSVP link
        approval_policy: fresh_consent_only
      tool_whoami:
        label: See which account is connected
        approval_policy: fresh_consent_only
surrogation:
  name: partypal
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - partypal.social
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /api/oauth/token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with PartyPal
    text: Muse can read your parties, guests, budgets, and vendors. It can plan events using credits,
      send invitations, and manage guests.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - Learn more about how we use this info in our [Privacy Policy](https://muse.ai/privacy) and [Health
    Policy](https://www.facebook.com/privacy/policies/health/).
  - Muse will exchange info with PartyPal. To learn more, view their [terms](https://partypal.social/terms)
    and [privacy policy](https://partypal.social/privacy).
