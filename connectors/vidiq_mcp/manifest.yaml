version: 1
metadata:
  visible_in_settings: true
connector: vidiq_mcp
category: business
display_name: vidIQ
icon: vidiq
description: Research YouTube performance and generate content ideas with vidIQ
cli:
  binary: vidiq-mcp
  skill: vidiq_mcp
auth:
  provider: vidiq_mcp
  required: true
  mcp:
    endpoint: https://mcp.vidiq.com/mcp
    oauth:
      type: oauth
      authorization_url: https://mcp.vidiq.com/mcp/authorize
      token_url: https://mcp.vidiq.com/mcp/token
      registration_url: https://mcp.vidiq.com/mcp/register
      resource: https://mcp.vidiq.com/mcp
      token_endpoint_auth_method: none
      scope: api
    tool_names:
      channels.read:
      - vidiq_user_channels
      - vidiq_balance
      - vidiq_get_channels_by_ids
      - vidiq_get_videos_by_ids
      - vidiq_channel_videos
      - vidiq_channel_search
      - vidiq_similar_channels
      - vidiq_youtube_search
      - vidiq_outliers
      - vidiq_trending_videos
      - vidiq_trend_categories
      - vidiq_similar_videos
      - vidiq_similar_thumbnails
      - vidiq_keyword_research
      - vidiq_video_stats
      - vidiq_channel_performance_trends
      - vidiq_channel_analytics
      - vidiq_subscriber_insights
      - vidiq_video_transcript
      - vidiq_video_comments
      - vidiq_instagram_tiktok_outlier_search
      - vidiq_ig_accounts_from_outliers
      - vidiq_ig_profile
      - vidiq_ig_profile_reels
      - vidiq_list_competitors
      - vidiq_jobs_list
      - vidiq_job_poll
      - vidiq_score_title
      - vidiq_score_thumbnail
      channels.modify:
      - vidiq_video_watch
      - vidiq_watch_shortform_content
      - vidiq_update_competitors
      - vidiq_generate_titles
      - vidiq_generate_thumbnail
      - vidiq_refine_thumbnail
      - vidiq_generate_script
surrogation:
  name: vidiq_mcp
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
  - mcp.vidiq.com
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  stripped:
  - credentials.refresh_token
  token_refresh:
  - path: /mcp/token
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      channels.read:
        label: Research channels, videos and performance
  write:
    default: ask
    label: Write permissions
    methods:
      channels.modify:
        label: Generate and analyze content and manage competitors
        approval_policy: fresh_consent_only
consent_screen:
  bullets:
  - icon: data_types
    title: Connect to vidIQ
    text: Research YouTube performance and generate content ideas with vidIQ.
  - icon: info
    title: You choose what Muse can do
    text: Muse can read information for your tasks. It will ask each time before making changes or running
      other actions. Disconnect at any time in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with vidIQ. To learn more, view their [terms](https://vidIQ.com/terms/) and [privacy policy](https://vidiq.com/privacy/).
