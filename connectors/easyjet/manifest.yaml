version: 1
gating:
  allowed_countries:
    default: [GB]
    exempt_vm_channels: [prod, quail, canary, internal-test]
metadata:
  visible_in_settings: false
auth:
  provider: easyjet
  required: false
  mcp:
    protocol_version: "2025-06-18"
    persistent_session: true
    cagi:
      path: /muse/mcp
    tool_names:
      travel.read:
        - fetch_compensation_info
        - fetch_flight_status
        - fetch_out_of_scope_guidance
        - list_holiday_destinations
        - list_supported_airports
        - search_flight_status
        - search_flights
        - search_holiday_packages
        - search_supported_routes
        - validate_easyjet_mcp_connection
cli:
  binary: easyjet
  skill: easyjet
connector: easyjet
display_name: easyJet
icon: easyjet
description: Search easyJet flights and holidays and check easyJet flight status with read-only access.
request_quota:
  mode: enforce
  workers: [easyjet]
  queries_per_minute: 30
  burst: 10
  queries_per_hour: 300
actions:
  read:
    default: allow
    label: Read
    response_guard: verification_codes
    methods:
      travel.read:
        label: Search flights, holidays and flight status
        approval_phrase: search easyJet flights, holidays and flight status
