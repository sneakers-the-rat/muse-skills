connector: intellist
version: 1
display_name: 'Intellist'
icon: intellist
description: "Manage checklists and inventory lists, search items, and update or check off items."
cli:
  binary: intellist-connector-cli
  skill: intellist
auth:
  provider: intellist
  required: true
  mcp:
    endpoint: https://intellist.app/api/mcp
    oauth:
      type: oauth
      authorization_url: https://qmsahjfwlerzusqyocxr.supabase.co/auth/v1/oauth/authorize
      token_url: https://qmsahjfwlerzusqyocxr.supabase.co/auth/v1/oauth/token
      token_endpoint_auth_method: none
      scope: email offline_access openid
      registration_url: https://qmsahjfwlerzusqyocxr.supabase.co/auth/v1/oauth/clients/register
      resource: https://intellist.app/api/mcp
    tool_names:
      tool_add_items:
      - add_items
      tool_create_list:
      - create_list
      tool_get_list:
      - get_list
      tool_list_lists:
      - list_lists
      tool_search_items:
      - search_items
      tool_set_item_checked:
      - set_item_checked
      tool_update_item:
      - update_item
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  write:
    label: Write permissions
    default: ask
    methods:
      tool_add_items:
        label: Add items to a list
        approval_policy: fresh_consent_only
      tool_create_list:
        label: Create a list
        approval_policy: fresh_consent_only
      tool_set_item_checked:
        label: Check or uncheck an item
        approval_policy: fresh_consent_only
      tool_update_item:
        label: Edit an item
        approval_policy: fresh_consent_only
  read:
    label: Read permissions
    default: ask
    methods:
      tool_get_list:
        label: Show a list
        approval_policy: fresh_consent_only
      tool_list_lists:
        label: List my lists
        approval_policy: fresh_consent_only
      tool_search_items:
        label: Find items
        approval_policy: fresh_consent_only
surrogation:
  name: intellist
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - intellist.app
  - qmsahjfwlerzusqyocxr.supabase.co
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /auth/v1/oauth/token
consent_screen:
  bullets:
  - icon: data_types
    title: 'Level up with Intellist: Lists & Inventory'
    text: Muse can read your synced lists and inventory. It can create lists, add or update items, and
      check them off.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - 'Muse will exchange info with Intellist: Lists & Inventory. To learn more, view their [terms](https://intellist.app/terms)
    and [privacy policy](https://intellist.app/privacy).'
