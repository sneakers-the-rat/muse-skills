version: 1
gating:
  allowed_countries:
    default: [MX]
    exempt_vm_channels: [prod, quail, canary, internal-test]
metadata:
  visible_in_settings: true
auth:
  provider: kavak
  required: true
cli:
  binary: kavak
  skill: kavak
connector: kavak
display_name: Kavak
icon: kavak
description: Search used-car inventory, read vehicle details and policies, and find Kavak showrooms and service hubs.
actions:
  read:
    default: allow
    label: Read Kavak inventory and information
    response_guard: verification_codes
    methods:
      inventory.filters:
        label: Read valid vehicle filters
      inventory.search:
        label: Search vehicle inventory
      inventory.get:
        label: Read vehicle details
      policies.query:
        label: Search Kavak policy information
      hubs.list:
        label: Find Kavak hubs and services
cli_subcommands:
  - status
  - inventory-filters
  - inventory-search
  - inventory-get
  - policies-query
  - hubs-list
consent_screen:
  bullets:
    - icon: data_types
      title: "Use Kavak"
      text: "Muse will send your vehicle searches and policy questions to Kavak and read its inventory, policies and hub information."
    - icon: info
      title: "You choose what Muse can do"
      text: "Manage permissions or disconnect at any time in Settings."
    - icon: caution
      title: "Information only"
      text: "Inventory and prices can change before you visit Kavak. This connector cannot book appointments or buy vehicles."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Kavak. By connecting, you agree to Kavak's [Terms and Conditions](https://kavak.com/mx/terminos-y-condiciones) and [Privacy Policy](https://kavak.com/mx/politicas-de-privacidad)."
