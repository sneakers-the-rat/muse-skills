id: rappi_mcp
title: "Rappi"
description: "Discover restaurants and prepare a cart in Mexico using your saved Rappi address and selected food. Muse prepares and verifies the cart, then you finish checkout and payment in Rappi. Current connector capabilities include non-charging cart preparation and hosted-checkout handoff. Account coupon redemption requires approval each time. Muse cannot access payment methods, pay or place orders. This version does not yet track active orders."
aliases: [rappi-mcp]
include_in_prompt: false
require_auth: true
availability:
  gk: hatch_connector_rappi_enabled
  confidential_vm: false
auth:
  authorize: cli
