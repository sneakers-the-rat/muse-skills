connector: postpone
version: 1
display_name: Postpone
icon: postpone
description: "Schedule and edit social posts, find recommended posting times, search media, and compare post and account performance."
cli:
  binary: postpone-connector-cli
  skill: postpone
auth:
  provider: postpone
  required: true
  mcp:
    endpoint: https://api.postpone.app/mcp
    oauth:
      type: oauth
      authorization_url: https://api.postpone.app/oauth/authorize/
      token_url: https://api.postpone.app/oauth/token/
      token_endpoint_auth_method: none
      scope: accounts:read analytics:read media:read posts:read posts:write
      registration_url: https://api.postpone.app/oauth/register
      resource: https://api.postpone.app/mcp
    tool_names:
      tool_postpone_create_social_post:
      - postpone_create_social_post
      tool_postpone_delete_social_posts:
      - postpone_delete_social_posts
      tool_postpone_edit_social_post:
      - postpone_edit_social_post
      tool_postpone_get_account_metadata:
      - postpone_get_account_metadata
      tool_postpone_get_account_stats:
      - postpone_get_account_stats
      tool_postpone_get_aggregate_post_metrics:
      - postpone_get_aggregate_post_metrics
      tool_postpone_get_recommended_post_times:
      - postpone_get_recommended_post_times
      tool_postpone_list_pinterest_boards:
      - postpone_list_pinterest_boards
      tool_postpone_list_post_metrics:
      - postpone_list_post_metrics
      tool_postpone_list_published_posts:
      - postpone_list_published_posts
      tool_postpone_list_scheduled_posts:
      - postpone_list_scheduled_posts
      tool_postpone_list_social_accounts:
      - postpone_list_social_accounts
      tool_postpone_reschedule_posts:
      - postpone_reschedule_posts
      tool_postpone_search_media:
      - postpone_search_media
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  write:
    label: Write permissions
    default: ask
    methods:
      tool_postpone_create_social_post:
        label: "Schedule a social post"
        approval_policy: fresh_consent_only
      tool_postpone_delete_social_posts:
        label: "Delete scheduled posts"
        approval_policy: fresh_consent_only
      tool_postpone_edit_social_post:
        label: "Edit a scheduled post"
        approval_policy: fresh_consent_only
      tool_postpone_reschedule_posts:
        label: "Change scheduled post times"
        approval_policy: fresh_consent_only
  read:
    label: Read permissions
    default: ask
    methods:
      tool_postpone_get_account_metadata:
        label: "Get account timezone and media labels"
        approval_policy: fresh_consent_only
      tool_postpone_get_account_stats:
        label: "Get follower and Reddit karma trends"
        approval_policy: fresh_consent_only
      tool_postpone_get_aggregate_post_metrics:
        label: "Get post performance totals and averages"
        approval_policy: fresh_consent_only
      tool_postpone_get_recommended_post_times:
        label: "Get recommended posting times"
        approval_policy: fresh_consent_only
      tool_postpone_list_pinterest_boards:
        label: "List Pinterest boards"
        approval_policy: fresh_consent_only
      tool_postpone_list_post_metrics:
        label: "List published posts and performance"
        approval_policy: fresh_consent_only
      tool_postpone_list_published_posts:
        label: "List published posts"
        approval_policy: fresh_consent_only
      tool_postpone_list_scheduled_posts:
        label: "List scheduled posts"
        approval_policy: fresh_consent_only
      tool_postpone_list_social_accounts:
        label: "List connected social accounts"
        approval_policy: fresh_consent_only
      tool_postpone_search_media:
        label: "Search the media library"
        approval_policy: fresh_consent_only
surrogation:
  name: postpone
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - api.postpone.app
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /oauth/token/
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Postpone
    text: Muse can read your social accounts, posts, media, and analytics. It can create, edit, reschedule,
      or delete posts.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Postpone. To learn more, view their [terms](https://www.postpone.app/terms)
    and [privacy policy](https://www.postpone.app/privacy).
