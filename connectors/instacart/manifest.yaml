version: 1
gating:
  allowed_countries: [US]
metadata:
  visible_in_settings: true
auth:
  # Public identifier for the registered Instacart OAuth application. The
  # client secret is held only by CAGI and must never be provisioned to the VM.
  client_id: "P7hqb0ZvKE3Q9M14YvmgIazNyhkvESM02zv3f1CxtFo"
  provider: instacart
  required: true
connector: instacart
display_name: Instacart
description: Shop for groceries for delivery or pickup
icon: instacart
request_quota:
  mode: shadow
  workers: [instacart]
  queries_per_minute: 60
  burst: 10
cli:
  binary: instacart
  skill: instacart
  service: instacart
actions:
  read:
    default: allow
    label: Browse Instacart products and cart
    methods:
      mcp.catalog:
        label: Read current Instacart tool guidance
        response_guard: disabled
      products.read:
        label: Search and compare products
        response_guard: disabled
      cart.read:
        label: View the cart and available retailers
        response_guard: disabled
  write:
    default: allow
    label: Manage the Instacart cart and shopping preferences
    methods:
      retailer.select:
        label: Search using a selected retailer
      cart.write:
        label: Add, update, or remove cart items and change shopping preferences
commands:
  status: null
  authorize-url: null
  exchange-code: null
  refresh: null
  disconnect: null
  list-tools: mcp.catalog
  # These commands choose a more specific method after validating their input.
  search-products: null
  cart: null
  add-to-cart: null
consent_screen:
  bullets:
    - icon: data_types
      title: "Level up with Instacart"
      text: "Muse will access things like stores, products, carts, orders and delivery address."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Instacart. To learn more, view their [terms](https://www.instacart.com/terms) and [privacy policy](https://www.instacart.com/privacy)."
