version: 1
metadata:
  visible_in_settings: true
connector: moneyforward_me
category: productivity
display_name: "マネーフォワード ME"
icon: moneyforward_me
description: "Review income and expense information, household budget records and related information, and asset and liability data in Money Forward ME"
gating:
  allowed_countries: [JP]
cli:
  binary: moneyforward-me
  skill: moneyforward_me
auth:
  provider: moneyforward_me
  required: true
  # MF's production client uses moneyforward.com endpoints. CAGI holds its secret.
  client_id: "8H83-kGqQ691GVklRv4ktrrp0EcZkZ4UOJvVTmSsbik"
  mcp:
    endpoint: "https://moneyforward.com/mcp"
    protocol_version: "2026-07-28"
    oauth:
      type: "oauth"
      authorization_url: "https://moneyforward.com/oauth/authorize"
      token_url: "https://moneyforward.com/oauth/token"
      scope: "me:asset:read me:transaction:read"
      resource: "https://moneyforward.com/mcp"
      # Local PKCE configuration only. brokers_provider routes exchange and
      # rotating-token refresh to CAGI, which sends client_secret_basic.
      token_endpoint_auth_method: "none"
    tool_names:
      assets.read: [list_asset_balances, list_asset_holdings]
      transactions.read: [list_transactions, list_household_summaries_by_category]
actions:
  read:
    default: allow
    label: "Read income, expense, asset and liability data"
    response_guard: verification_codes
    methods:
      assets.read:
        # Consent grants read access; no side effects require fresh approval.
        approval_policy: default
        label: "Read account balances and the value of held securities"
        approval_phrase: "read account balances and the value of held securities in Money Forward ME"
      transactions.read:
        # Consent grants read access; no side effects require fresh approval.
        approval_policy: default
        label: "Read transaction details, income and expense by category"
        approval_phrase: "read transaction details, income and expense by category in Money Forward ME"
consent_screen:
  bullets:
    - icon: data_types
      title: "Understand your finances with Money Forward ME"
      text: "Muse accesses income and expense information, household budget records and related information, and asset and liability data from financial services in Money Forward ME, including banks, credit cards, securities accounts, pensions, electronic money, and loyalty points."
    - icon: info
      title: "Read-only access"
      text: "Muse can read data in Money Forward ME, but cannot buy or sell financial products, withdraw or transfer money, change account settings, update data, or perform similar actions. You can disconnect at any time in Settings."
    - icon: caution
      title: "Check the latest information"
      text: "Information about income, expenses, assets, and other matters reflects Money Forward ME's most recent update. Check the latest information before making final decisions about your assets or household finances, which are your responsibility."
  footer_paragraphs:
    - "The information used for tasks is part of your interactions with Muse and may be used to improve Meta's AI. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "For information about the handling of Money Forward ME data, see Money Forward ME's [Terms of Service](https://moneyforward.com/terms) and [Privacy Policy](https://corp.hm.moneyforward.com/privacy)."
