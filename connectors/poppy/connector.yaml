id: poppy
title: "Personal Agent Protocol"
description: "Work with companies that publish a Personal Agent Protocol (Poppy) document: verify them, open sessions, sign the user in to their account where the company offers it, call their APIs and confirm the actions they propose after the user approves."
aliases: [poppy, personal_agent_protocol]
include_in_prompt: false
availability:
  gk: hatch_poppy_enabled
  confidential_vm: false
features:
  poppy-conversations:
    gk: hatch_poppy_conversations
    # The daemon also stops starting, polling and sending company
    # conversations, and the Poppy agent loses `company_conversation.start`.
    methods: [conversation.approve]
