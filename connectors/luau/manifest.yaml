connector: luau
version: 1
display_name: Luau
icon: luau
description: "Find friends' availability, plan gatherings, send invitations, and manage guest responses, recurring events and sign-up lists."
cli:
  binary: luau-connector-cli
  skill: luau
auth:
  provider: luau
  required: true
  mcp:
    endpoint: https://app.luau.co/api/mcp
    oauth:
      type: oauth
      authorization_url: https://app.luau.co/oauth/authorize
      token_url: https://app.luau.co/api/oauth/token
      token_endpoint_auth_method: none
      scope: events.read events.write invites.write rsvp.write social.read social.write
    tool_names:
      tool_add_co_host:
      - add_co_host
      tool_add_important_date:
      - add_important_date
      tool_add_series_events:
      - add_series_events
      tool_add_signup_item:
      - add_signup_item
      tool_assign_signup:
      - assign_signup
      tool_cancel_event:
      - cancel_event
      tool_cancel_series:
      - cancel_series
      tool_cancel_series_event:
      - cancel_series_event
      tool_claim_signup:
      - claim_signup
      tool_create_crew:
      - create_crew
      tool_create_event:
      - create_event
      tool_create_event_series:
      - create_event_series
      tool_create_hangvite:
      - create_hangvite
      tool_create_signups_sheet:
      - create_signups_sheet
      tool_crew_invite_link:
      - crew_invite_link
      tool_find_people:
      - find_people
      tool_find_time:
      - find_time
      tool_friends_to_reconnect:
      - friends_to_reconnect
      tool_get_event:
      - get_event
      tool_get_event_by_url:
      - get_event_by_url
      tool_get_hangvite_status:
      - get_hangvite_status
      tool_get_my_profile:
      - get_my_profile
      tool_get_series:
      - get_series
      tool_get_signups_board:
      - get_signups_board
      tool_get_signups_roster:
      - get_signups_roster
      tool_get_social_goals:
      - get_social_goals
      tool_group_history:
      - group_history
      tool_invite_guests:
      - invite_guests
      tool_invite_to_hangvite:
      - invite_to_hangvite
      tool_invite_to_series:
      - invite_to_series
      tool_last_hangout_with:
      - last_hangout_with
      tool_list_crews:
      - list_crews
      tool_list_my_events:
      - list_my_events
      tool_list_my_series:
      - list_my_series
      tool_list_planning_opportunities:
      - list_planning_opportunities
      tool_log_moment:
      - log_moment
      tool_mark_attendance:
      - mark_attendance
      tool_mutual_friends:
      - mutual_friends
      tool_my_circle:
      - my_circle
      tool_postpone_event:
      - postpone_event
      tool_preview_event:
      - preview_event
      tool_remind_non_responders:
      - remind_non_responders
      tool_remove_co_host:
      - remove_co_host
      tool_reschedule_series_event:
      - reschedule_series_event
      tool_respond_to_hangvite:
      - respond_to_hangvite
      tool_rsvp:
      - rsvp
      tool_rsvp_to_series:
      - rsvp_to_series
      tool_set_event_image:
      - set_event_image
      tool_set_new_date:
      - set_new_date
      tool_set_social_goal:
      - set_social_goal
      tool_share_need:
      - share_need
      tool_uninvite_guest:
      - uninvite_guest
      tool_update_crew:
      - update_crew
      tool_update_event:
      - update_event
      tool_update_series:
      - update_series
      tool_update_signups_sheet:
      - update_signups_sheet
      tool_upload_event_image:
      - upload_event_image
      tool_who_is_free:
      - who_is_free
    protocol_version: '2025-06-18'
  client_id: kai-muse-connector
metadata:
  visible_in_settings: true
actions:
  write:
    label: Write permissions
    default: ask
    methods:
      tool_add_co_host:
        label: "Add an event co-host"
        approval_policy: fresh_consent_only
      tool_add_important_date:
        label: "Add a recurring important date"
        approval_policy: fresh_consent_only
      tool_add_series_events:
        label: "Add dates to an event series"
        approval_policy: fresh_consent_only
      tool_add_signup_item:
        label: "Add an item you will bring"
        approval_policy: fresh_consent_only
      tool_assign_signup:
        label: "Sign a guest up to help or bring supplies"
        approval_policy: fresh_consent_only
      tool_cancel_event:
        label: "Cancel an event"
        approval_policy: fresh_consent_only
      tool_cancel_series:
        label: "Cancel all upcoming events in a series"
        approval_policy: fresh_consent_only
      tool_cancel_series_event:
        label: "Cancel one event in a series"
        approval_policy: fresh_consent_only
      tool_claim_signup:
        label: "Sign up to help or bring supplies"
        approval_policy: fresh_consent_only
      tool_create_crew:
        label: "Create a group of friends"
        approval_policy: fresh_consent_only
      tool_create_event:
        label: "Create an event"
        approval_policy: fresh_consent_only
      tool_create_event_series:
        label: "Create an event series"
        approval_policy: fresh_consent_only
      tool_create_hangvite:
        label: "Send invitations to meet today"
        approval_policy: fresh_consent_only
      tool_create_signups_sheet:
        label: "Create an event sign-up sheet"
        approval_policy: fresh_consent_only
      tool_invite_guests:
        label: "Send event invitations"
        approval_policy: fresh_consent_only
      tool_invite_to_hangvite:
        label: "Invite more people to today's gathering"
        approval_policy: fresh_consent_only
      tool_invite_to_series:
        label: "Send invitations to an event series"
        approval_policy: fresh_consent_only
      tool_log_moment:
        label: "Record a past gathering"
        approval_policy: fresh_consent_only
      tool_mark_attendance:
        label: "Update attendance for a past event"
        approval_policy: fresh_consent_only
      tool_postpone_event:
        label: "Postpone an event without a new date"
        approval_policy: fresh_consent_only
      tool_remind_non_responders:
        label: "Remind guests who have not responded"
        approval_policy: fresh_consent_only
      tool_remove_co_host:
        label: "Remove an event co-host"
        approval_policy: fresh_consent_only
      tool_reschedule_series_event:
        label: "Reschedule one event in a series"
        approval_policy: fresh_consent_only
      tool_respond_to_hangvite:
        label: "Respond to an invitation to meet today"
        approval_policy: fresh_consent_only
      tool_rsvp:
        label: "Respond to an event invitation"
        approval_policy: fresh_consent_only
      tool_rsvp_to_series:
        label: "Respond to all upcoming events in a series"
        approval_policy: fresh_consent_only
      tool_set_event_image:
        label: "Set an event invitation image"
        approval_policy: fresh_consent_only
      tool_set_new_date:
        label: "Set a new date for a postponed event"
        approval_policy: fresh_consent_only
      tool_set_social_goal:
        label: "Set a social goal"
        approval_policy: fresh_consent_only
      tool_uninvite_guest:
        label: "Revoke a guest invitation"
        approval_policy: fresh_consent_only
      tool_update_crew:
        label: "Change or delete a group of friends"
        approval_policy: fresh_consent_only
      tool_update_event:
        label: "Change event details and settings"
        approval_policy: fresh_consent_only
      tool_update_series:
        label: "Change event series details and settings"
        approval_policy: fresh_consent_only
      tool_update_signups_sheet:
        label: "Edit an event sign-up sheet"
        approval_policy: fresh_consent_only
      tool_upload_event_image:
        label: "Upload an event invitation image"
        approval_policy: fresh_consent_only
  read:
    label: Read permissions
    default: ask
    methods:
      tool_crew_invite_link:
        label: "Get a group invitation link"
        approval_policy: fresh_consent_only
      tool_find_people:
        label: "Find friends by name"
        approval_policy: fresh_consent_only
      tool_find_time:
        label: "Find a time for friends to meet"
        approval_policy: fresh_consent_only
      tool_friends_to_reconnect:
        label: "Find friends you have not seen recently"
        approval_policy: fresh_consent_only
      tool_get_event:
        label: "Get event details and guest responses"
        approval_policy: fresh_consent_only
      tool_get_event_by_url:
        label: "Get event or series details from a link"
        approval_policy: fresh_consent_only
      tool_get_hangvite_status:
        label: "Check responses to today's invitations"
        approval_policy: fresh_consent_only
      tool_get_my_profile:
        label: "Get profile and planning preferences"
        approval_policy: fresh_consent_only
      tool_get_series:
        label: "Get event series details and schedule"
        approval_policy: fresh_consent_only
      tool_get_signups_board:
        label: "Get event sign-ups and open needs"
        approval_policy: fresh_consent_only
      tool_get_signups_roster:
        label: "Get the event sign-up roster"
        approval_policy: fresh_consent_only
      tool_get_social_goals:
        label: "Get social goals and progress"
        approval_policy: fresh_consent_only
      tool_group_history:
        label: "Get past gatherings for a group of friends"
        approval_policy: fresh_consent_only
      tool_last_hangout_with:
        label: "Get past gatherings with a friend"
        approval_policy: fresh_consent_only
      tool_list_crews:
        label: "List groups of friends"
        approval_policy: fresh_consent_only
      tool_list_my_events:
        label: "List your events and invitations"
        approval_policy: fresh_consent_only
      tool_list_my_series:
        label: "List your event series"
        approval_policy: fresh_consent_only
      tool_list_planning_opportunities:
        label: "List planning suggestions"
        approval_policy: fresh_consent_only
      tool_mutual_friends:
        label: "Find mutual friends and connections"
        approval_policy: fresh_consent_only
      tool_my_circle:
        label: "List your closest friends"
        approval_policy: fresh_consent_only
      tool_preview_event:
        label: "Preview an event or series"
        approval_policy: fresh_consent_only
      tool_share_need:
        label: "Prepare a request for event help"
        approval_policy: fresh_consent_only
      tool_who_is_free:
        label: "Check friends' availability"
        approval_policy: fresh_consent_only
surrogation:
  name: luau
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - app.luau.co
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /api/oauth/token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Luau
    text: Muse can read your friends, events, and guest lists. It can create or cancel events, invite
      guests, and send RSVPs.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Luau. To learn more, view their [terms](https://luau.co/terms) and [privacy
    policy](https://luau.co/privacy).
