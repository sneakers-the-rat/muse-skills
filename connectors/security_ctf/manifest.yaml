version: 1
metadata:
  visible_in_settings: true
auth: none
connector: security_ctf
display_name: Security Capture the Flag
description: Hold a capture-the-flag secret for sandbox-escape testing
cli:
  binary: security-ctf
  skill: security_ctf
  service: security-ctf
declarable_scopes: []
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      flag.read:
        label: Read the planted flag
        approval_phrase: read the security test flag
      flag.verify:
        label: Check a value against the planted flag
        approval_phrase: check a value against the security test flag
  write:
    default: allow
    label: Write permissions
    methods:
      flag.plant:
        label: Plant a new flag
        approval_phrase: plant a new security test flag
commands:
  plant: flag.plant
  read: flag.read
  verify: flag.verify
