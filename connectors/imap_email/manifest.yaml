version: 1
metadata:
  visible_in_settings: true
auth:
  provider: imap_email
  required: true
cli:
  binary: imap-email
  skill: imap_email
connector: imap_email
category: productivity
display_name: IMAP Email
description: Read, send and organize email in an IMAP mailbox
icon: email
multi_account:
  backend: username_password
  credential_namespace: imap_email_accounts
  expose_routing_metadata: true
request_quota:
  mode: enforce
  workers:
    - imap-email
  queries_per_minute: 120
  burst: 20
actions:
  read:
    default: allow
    label: Read permissions
    response_guard: verification_codes
    methods:
      messages.list:
        label: List and search messages
        approval_phrase: list and search messages in IMAP Email
      messages.get:
        label: Access messages and attachment details
        approval_phrase: access messages and attachment details in IMAP Email
      attachments.download:
        label: Download attachments
        approval_phrase: download an attachment from IMAP Email
        # Bytes go only to the caller's file; stdout carries path, name and size.
        response_guard: disabled
  write:
    default: ask
    label: Write and delete permissions
    methods:
      messages.send:
        approval_policy: fresh_consent_or_task_allow
        label: Send emails
        approval_phrase: send this email in IMAP Email
        approval_buttons:
          allow_once: "Send"
          deny: "Don't send"
          deny.task: "Don't send"
        approval_button_variants:
          reply:
            allow_once: "Reply"
            deny: "Don't reply"
            deny.task: "Don't reply"
          reply_all:
            allow_once: "Reply all"
            deny: "Don't reply all"
            deny.task: "Don't reply all"
          forward:
            allow_once: "Forward"
            deny: "Don't forward"
            deny.task: "Don't forward"
      drafts.manage:
        default: allow
        label: Create, edit and delete drafts
        approval_phrase: create, edit or delete drafts in IMAP Email
      messages.organize:
        default: allow
        label: Mark, flag, move and archive emails
        approval_phrase: mark, flag, move, copy or archive emails in IMAP Email
      messages.trash:
        default: allow
        label: Move emails to trash
        approval_phrase: move emails to trash in IMAP Email
        approval_buttons:
          allow_once: "Move"
          deny: "Don't move"
          deny.task: "Don't move"
commands:
  status: null
  accounts: null
  folders: messages.list
  list: messages.list
  search: messages.list
  get: messages.get
  attachment: attachments.download
  send: messages.send
  reply: messages.send
  reply-all: messages.send
  forward: messages.send
  draft-send: messages.send
  draft-create: drafts.manage
  draft-update: drafts.manage
  draft-delete: drafts.manage
  mark-read: messages.organize
  mark-unread: messages.organize
  flag: messages.organize
  unflag: messages.organize
  move: messages.organize
  copy: messages.organize
  archive: messages.organize
  trash: messages.trash

consent_screen:
  bullets:
    - icon: data_types
      title: "Use mail from another provider"
      text: "Muse will access message content, attachments, sender details and mailbox metadata, and can send, draft and organize mail."
    - icon: info
      title: "You control access to your mail"
      text: "By default, Muse will ask before sending email. It uses the account only for the mail tasks you request."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with your email provider. Review that provider's terms and privacy policy before connecting."
