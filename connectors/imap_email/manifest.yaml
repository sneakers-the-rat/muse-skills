version: 1
metadata:
  visible_in_settings: false
auth:
  provider: imap_email
  required: true
cli:
  binary: imap-email
  skill: imap_email
connector: imap_email
category: productivity
display_name: IMAP Email
description: Search and read email from an IMAP mailbox
icon: email
multi_account:
  backend: username_password
  credential_namespace: imap_email_accounts
  expose_routing_metadata: true
request_quota:
  mode: enforce
  workers:
    - imap-email
  queries_per_minute: 120
  burst: 20
actions:
  read:
    default: allow
    label: Read permissions
    response_guard: verification_codes
    methods:
      messages.list:
        label: List and search messages
        approval_phrase: list and search messages in IMAP Email
      messages.get:
        label: Access messages and attachment details
        approval_phrase: access messages and attachment details in IMAP Email
commands:
  status: null
  accounts: null
  folders: messages.list
  list: messages.list
  search: messages.list
  get: messages.get

consent_screen:
  bullets:
    - icon: data_types
      title: "Read mail from another provider"
      text: "Muse will access message content, attachment details, sender details and mailbox metadata."
    - icon: info
      title: "You control access to your mail"
      text: "Muse will use the account only for the mail tasks you request."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with your email provider. Review that provider's terms and privacy policy before connecting."
