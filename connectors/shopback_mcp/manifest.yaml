version: 1
gating:
  allowed_countries: [SG]
metadata:
  visible_in_settings: true
connector: shopback_mcp
display_name: "ShopBack"
icon: shopback
description: "Find ShopBack cashback offers and hotel and flight deals, check your cashback and promos, and shop through cashback-tracked links"
cli:
  binary: shopback-mcp
  skill: shopback_mcp
auth:
  provider: shopback_mcp
  required: true
  client_id: "56e2c78d-04a7-4199-b136-05f8da5afac5"
  mcp:
    endpoint: "https://connect.shopback.com/shopping-agent/mcp"
    oauth:
      type: "oauth"
      authorization_url: "https://connect.shopback.com/oauth2/auth"
      token_url: "https://connect.shopback.com/oauth2/token"
      revoke_url: "https://connect.shopback.com/oauth2/revoke"
      revoke_on_disconnect: true
      scope: "openid offline_access offers:read trips:create promos:claim"
      token_endpoint_auth_method: "none"
    tool_names:
      offers.read: [search_merchants, get_merchant_offers, get_product_link_cashback]
      account.read: [get_cashback_balance, list_my_promos, list_my_ecards]
      travel.read:
        - search_travel_location_name_to_id_fuzzy_search
        - search_travel_query_hotel_deals
        - search_travel_query_flight_deals
      trips.create: [get_shopping_link]
      promos.claim: [claim_promo]
actions:
  read:
    default: allow
    label: "Read permissions"
    response_guard: verification_codes
    methods:
      offers.read:
        label: "Search ShopBack merchants and brands, read your offers and check product links for cashback"
        approval_phrase: "search ShopBack merchants, read your offers and check product links for cashback"
      account.read:
        label: "Read your ShopBack cashback balance, claimed promos and eCards"
        approval_phrase: "read your ShopBack cashback balance, claimed promos and eCards"
      travel.read:
        label: "Search ShopBack hotel and flight deals with cashback"
        approval_phrase: "search ShopBack hotel and flight deals with cashback"
  write:
    default: ask
    label: "Write permissions"
    methods:
      trips.create:
        label: "Create cashback-tracked shopping trips to merchants"
        approval_phrase: "create a cashback-tracked ShopBack shopping trip to the merchant or product below"
      promos.claim:
        label: "Claim ShopBack Pay promos to your ShopBack account"
        approval_phrase: "claim the ShopBack Pay promo below to your ShopBack account"
consent_screen:
  bullets:
    - icon: data_types
      title: "Earn cashback with ShopBack"
      text: "Muse will access ShopBack merchants and brands, your personalised offers, your confirmed cashback balance, the ShopBack Pay promos and eCards you hold, and the shopping trips it creates and promos it claims. Hotel and flight searches share your destination, dates and number of travellers with ShopBack."
    - icon: info
      title: "You choose what Muse can do"
      text: "Muse asks before creating a cashback-tracked shopping trip or claiming a promo unless you have allowed that action in ShopBack permissions. It opens a hotel or flight booking link only when you ask it to book, and asks before any payment. Disconnect at any time in Settings."
    - icon: caution
      title: "Cashback isn't guaranteed"
      text: "Rates, caps and eligibility are set by ShopBack and the merchant. Estimates can change, and cashback is confirmed only after the order is validated."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with ShopBack. To learn more, view their [terms](https://support.shopback.sg/hc/en-gb/articles/360039156774-Terms-of-use) and [privacy policy](https://support.shopback.sg/hc/en-gb/articles/360039652893-ShopBack-Privacy-Policy)."
