connector: findtime_io
version: 1
display_name: findtime.io
icon: findtime_io
description: "Compare time zones, find meeting times, manage booking requests and appointments, and check recurring schedules across daylight-saving changes."
cli:
  binary: findtime-io-connector-cli
  skill: findtime_io
auth:
  provider: findtime_io
  required: true
  mcp:
    endpoint: https://mcp.findtime.io/mcp
    oauth:
      type: oauth
      authorization_url: https://mcp.findtime.io/oauth/authorize
      token_url: https://mcp.findtime.io/oauth/token
      token_endpoint_auth_method: none
      scope: meetings:plan time:read
      registration_url: https://mcp.findtime.io/oauth/register
      resource: https://mcp.findtime.io/mcp
    tool_names:
      tool_answer_time_question:
      - answer_time_question
      tool_approve_booking_request:
      - approve_booking_request
      tool_are_they_awake:
      - are_they_awake
      tool_cancel_booking:
      - cancel_booking
      tool_cancel_booking_as_host:
      - cancel_booking_as_host
      tool_check_proposed_time:
      - check_proposed_time
      tool_convert_time:
      - convert_time
      tool_create_invite_link:
      - create_invite_link
      tool_decline_booking_request:
      - decline_booking_request
      tool_delete_team:
      - delete_team
      tool_find_host_slots:
      - find_host_slots
      tool_find_meeting_time:
      - find_meeting_time
      tool_get_booking_status:
      - get_booking_status
      tool_get_current_time:
      - get_current_time
      tool_get_dst_schedule:
      - get_dst_schedule
      tool_get_findtime_help:
      - get_findtime_help
      tool_get_host_booking_profile:
      - get_host_booking_profile
      tool_get_location_by_id:
      - get_location_by_id
      tool_get_my_booking_page:
      - get_my_booking_page
      tool_get_overlap_hours:
      - get_overlap_hours
      tool_get_team:
      - get_team
      tool_list_booking_requests:
      - list_booking_requests
      tool_list_my_booking_requests:
      - list_my_booking_requests
      tool_list_teams:
      - list_teams
      tool_rank_recurring_slot:
      - rank_recurring_slot
      tool_rename_team:
      - rename_team
      tool_request_booking:
      - request_booking
      tool_reschedule_booking:
      - reschedule_booking
      tool_revoke_invite_link:
      - revoke_invite_link
      tool_save_team:
      - save_team
      tool_search_timezones:
      - search_timezones
      tool_send_feedback:
      - send_feedback
      tool_time_snapshot:
      - time_snapshot
      tool_update_booking_page:
      - update_booking_page
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  read:
    label: Read permissions
    default: ask
    methods:
      tool_answer_time_question:
        label: Answer a time question
        approval_policy: fresh_consent_only
      tool_are_they_awake:
        label: Check who is awake
        approval_policy: fresh_consent_only
      tool_check_proposed_time:
        label: Check a proposed meeting time
        approval_policy: fresh_consent_only
      tool_convert_time:
        label: Convert a time
        approval_policy: fresh_consent_only
      tool_find_host_slots:
        label: Find a host's open times
        approval_policy: fresh_consent_only
      tool_find_meeting_time:
        label: Find a meeting time
        approval_policy: fresh_consent_only
      tool_get_booking_status:
        label: Check a booking request
        approval_policy: fresh_consent_only
      tool_get_current_time:
        label: Get the current time
        approval_policy: fresh_consent_only
      tool_get_dst_schedule:
        label: Get a daylight saving schedule
        approval_policy: fresh_consent_only
      tool_get_findtime_help:
        label: Get findtime.io help
        approval_policy: fresh_consent_only
      tool_get_host_booking_profile:
        label: Get a host's booking profile
        approval_policy: fresh_consent_only
      tool_get_location_by_id:
        label: Get a location by ID
        approval_policy: fresh_consent_only
      tool_get_my_booking_page:
        label: Get my booking page
        approval_policy: fresh_consent_only
      tool_get_overlap_hours:
        label: Find shared work hours
        approval_policy: fresh_consent_only
      tool_get_team:
        label: Get a saved group
        approval_policy: fresh_consent_only
      tool_list_booking_requests:
        label: List my incoming booking requests
        approval_policy: fresh_consent_only
      tool_list_my_booking_requests:
        label: List my booking requests
        approval_policy: fresh_consent_only
      tool_list_teams:
        label: List saved groups
        approval_policy: fresh_consent_only
      tool_rank_recurring_slot:
        label: Rank a recurring meeting time
        approval_policy: fresh_consent_only
      tool_search_timezones:
        label: Search places and time zones
        approval_policy: fresh_consent_only
      tool_time_snapshot:
        label: Get a time snapshot
        approval_policy: fresh_consent_only
  write:
    label: Write permissions
    default: ask
    methods:
      tool_approve_booking_request:
        label: Approve a booking request
        approval_policy: fresh_consent_only
      tool_cancel_booking:
        label: Cancel my booking
        approval_policy: fresh_consent_only
      tool_cancel_booking_as_host:
        label: Cancel a booking as host
        approval_policy: fresh_consent_only
      tool_create_invite_link:
        label: Create a personal invite link
        approval_policy: fresh_consent_only
      tool_decline_booking_request:
        label: Decline a booking request
        approval_policy: fresh_consent_only
      tool_delete_team:
        label: Delete a saved group
        approval_policy: fresh_consent_only
      tool_rename_team:
        label: Rename a saved group
        approval_policy: fresh_consent_only
      tool_request_booking:
        label: Request a booking
        approval_policy: fresh_consent_only
      tool_reschedule_booking:
        label: Reschedule my booking request
        approval_policy: fresh_consent_only
      tool_revoke_invite_link:
        label: Revoke a personal invite link
        approval_policy: fresh_consent_only
      tool_save_team:
        label: Save a group
        approval_policy: fresh_consent_only
      tool_send_feedback:
        label: Report a wrong answer
        approval_policy: fresh_consent_only
      tool_update_booking_page:
        label: Update my booking page
        approval_policy: fresh_consent_only
surrogation:
  name: findtime_io
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - mcp.findtime.io
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /oauth/token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with findtime.io
    text: Muse can compare time zones and find meeting times. It can change your teams, booking page,
      invitations, and bookings.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with findtime.io. To learn more, view their [terms](https://findtime.io/terms/)
    and [privacy policy](https://findtime.io/privacy/).
