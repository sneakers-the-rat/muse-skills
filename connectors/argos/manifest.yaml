version: 1
gating:
  allowed_countries:
    default: [GB]
    exempt_vm_channels: [prod, quail, canary]
metadata:
  visible_in_settings: true
connector: argos
display_name: Argos
icon: argos
description: Search Argos products, read product details and check store and delivery stock
request_quota:
  mode: enforce
  workers: [argos]
  queries_per_minute: 30
  burst: 10
cli:
  binary: argos
  skill: argos
auth:
  provider: argos
  required: true
  mcp:
    protocol_version: "2025-06-18"
    persistent_session: false
    cagi:
      path: /mcp
    tool_names:
      shopping.read:
        - search_products
        - browse_category
        - get_facets
        - get_product
        - get_products
        - get_product_resource
        - get_sku_availability
        - check_basket_availability
actions:
  read:
    default: allow
    label: Read permissions
    response_guard: verification_codes
    methods:
      shopping.read:
        label: Search products and check stock
        approval_phrase: search Argos and check stock
consent_screen:
  bullets:
    - icon: data_types
      title: "Shop the Argos catalogue"
      text: "Muse can search Argos products, compare prices and details, and check stock at nearby stores or for delivery."
    - icon: info
      title: "Read-only access"
      text: "Muse sends Argos the products you ask about and, for stock checks, a town or postcode. It cannot add to a basket, reserve, buy or pay through this connector; you buy on argos.co.uk."
    - icon: caution
      title: "Check before you buy"
      text: "Prices and stock can change, and a stock check is not a reservation. Confirm the details on Argos before buying."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Argos. To learn more, view their [terms](https://help.argos.co.uk/help/terms-and-conditions) and [privacy policy](https://privacy-hub.sainsburys.co.uk/privacy-policy/)."
