connector: pantryfy
version: 1
display_name: Pantryfy
icon: pantryfy
description: "Manage pantry items, expiry dates, recipes, weekly meal plans and shopping lists."
cli:
  binary: pantryfy-connector-cli
  skill: pantryfy
auth:
  provider: pantryfy
  required: true
  mcp:
    endpoint: https://api.pantryfy.ai/mcp-muse/
    oauth:
      type: oauth
      authorization_url: https://api.pantryfy.ai/oauth/authorize
      token_url: https://api.pantryfy.ai/oauth/token
      token_endpoint_auth_method: none
      scope: pantry:read pantry:write planner:read planner:write recipes:read recipes:write shopping:read
        shopping:write
      cimd: true
      resource: https://api.pantryfy.ai/mcp-muse/
    tool_names:
      tool_household_context:
      - household_context
      tool_pantry_add:
      - pantry_add
      tool_pantry_expiring:
      - pantry_expiring
      tool_pantry_search:
      - pantry_search
      tool_pantry_substitute:
      - pantry_substitute
      tool_pantry_update:
      - pantry_update
      tool_planner_add_meals:
      - planner_add_meals
      tool_planner_complete_meal:
      - planner_complete_meal
      tool_planner_get_week:
      - planner_get_week
      tool_recipes_create:
      - recipes_create
      tool_recipes_get:
      - recipes_get
      tool_recipes_make_now:
      - recipes_make_now
      tool_recipes_search:
      - recipes_search
      tool_recipes_update:
      - recipes_update
      tool_shopping_add:
      - shopping_add
      tool_shopping_check_item:
      - shopping_check_item
      tool_shopping_create_list:
      - shopping_create_list
      tool_shopping_generate_from_week:
      - shopping_generate_from_week
      tool_shopping_get:
      - shopping_get
      tool_shopping_list:
      - shopping_list
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  read:
    label: Read permissions
    default: ask
    methods:
      tool_household_context:
        label: Get a household kitchen snapshot
        approval_policy: fresh_consent_only
      tool_pantry_expiring:
        label: Check expiring pantry items
        approval_policy: fresh_consent_only
      tool_pantry_search:
        label: Search the pantry
        approval_policy: fresh_consent_only
      tool_pantry_substitute:
        label: Suggest an ingredient substitute
        approval_policy: fresh_consent_only
      tool_planner_get_week:
        label: Get a week's meal plan
        approval_policy: fresh_consent_only
      tool_recipes_get:
        label: Get a saved recipe
        approval_policy: fresh_consent_only
      tool_recipes_make_now:
        label: Find what you can cook now
        approval_policy: fresh_consent_only
      tool_recipes_search:
        label: Search saved recipes
        approval_policy: fresh_consent_only
      tool_shopping_get:
        label: Get shopping lists
        approval_policy: fresh_consent_only
      tool_shopping_list:
        label: List shopping lists
        approval_policy: fresh_consent_only
  write:
    label: Write permissions
    default: ask
    methods:
      tool_pantry_add:
        label: Add items to the pantry
        approval_policy: fresh_consent_only
      tool_pantry_update:
        label: Update a pantry item
        approval_policy: fresh_consent_only
      tool_planner_add_meals:
        label: Add meals to the plan
        approval_policy: fresh_consent_only
      tool_planner_complete_meal:
        label: Mark a meal cooked
        approval_policy: fresh_consent_only
      tool_recipes_create:
        label: Create a recipe
        approval_policy: fresh_consent_only
      tool_recipes_update:
        label: Update a recipe
        approval_policy: fresh_consent_only
      tool_shopping_add:
        label: Add items to a shopping list
        approval_policy: fresh_consent_only
      tool_shopping_check_item:
        label: Check off a shopping item
        approval_policy: fresh_consent_only
      tool_shopping_create_list:
        label: Create a shopping list
        approval_policy: fresh_consent_only
      tool_shopping_generate_from_week:
        label: Generate a list from a week
        approval_policy: fresh_consent_only
surrogation:
  name: pantryfy
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - api.pantryfy.ai
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /oauth/token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Pantryfy
    text: Muse can read your pantry, dietary and health preferences, recipes, meal plans, and shopping
      lists. It can change them.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - Learn more about how we use this info in our [Privacy Policy](https://muse.ai/privacy) and [Health
    Policy](https://www.facebook.com/privacy/policies/health/).
  - Muse will exchange info with Pantryfy. To learn more, view their [terms](https://pantryfy.ai/terms)
    and [privacy policy](https://pantryfy.ai/privacy).
