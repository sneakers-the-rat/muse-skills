id: zocdoc
title: "Zocdoc"
description: "Find US doctors and other healthcare providers, their specialties, accepted insurance plans, visit reasons and open appointment times on Zocdoc, with booking links to complete there."
aliases: [zocdoc]
include_in_prompt: false
require_auth: false
availability:
  gk: hatch_connector_zocdoc_enable
  # Off until a CVM launch adds a CVM disclosure with non_confidential, gives
  # the CAGI TEE gateway Zocdoc's client credentials, and removes the worker's
  # NonConfidentialOnly in spawnd's privsep_registry/tools.rs.
  confidential_vm: false
