version: 1
gating:
  allowed_countries: [US]
metadata:
  visible_in_settings: false
auth: none
connector: zocdoc
category: health
display_name: Zocdoc
icon: zocdoc
description: Search healthcare providers and appointment availability on Zocdoc
request_quota:
  mode: shadow
  workers: [zocdoc]
  queries_per_minute: 50
  burst: 10
cli:
  binary: zocdoc
  skill: zocdoc
  service: zocdoc
declarable_scopes: []
actions:
  read:
    default: allow
    label: Search Zocdoc
    response_guard: verification_codes
    methods:
      catalog.read:
        label: Inspect reviewed Zocdoc capabilities
        approval_phrase: inspect reviewed Zocdoc capabilities
      providers.read:
        label: Search providers and care options
        approval_phrase: search providers and care options on Zocdoc
      appointments.read:
        label: Check appointment availability
        approval_phrase: check appointment availability on Zocdoc
      insurance.read:
        label: Search insurance plans and carriers
        approval_phrase: search insurance plans and carriers on Zocdoc
commands:
  status: null
  disconnect: null
  list-tools: catalog.read
  # Each reviewed provider tool selects its own method at runtime.
  call-tool: null
consent_screen:
  bullets:
    - icon: data_types
      title: "Find care with Zocdoc"
      text: "Muse can search providers, locations, insurance plans, and appointment availability."
    - icon: info
      title: "Booking stays with Zocdoc"
      text: "Muse can share a Zocdoc booking link, but it cannot book or cancel an appointment through this connector."
    - icon: caution
      title: "Confirm important details"
      text: "Provider participation and appointment availability can change. Confirm insurance coverage and visit details before booking."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Zocdoc. To learn more, view their [terms](https://www.zocdoc.com/about/terms/) and [privacy policy](https://www.zocdoc.com/about/privacy/)."
