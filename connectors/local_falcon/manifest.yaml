surrogation:
  name: local_falcon
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - mcp.localfalcon.com
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /oauth/token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Local Falcon
    text: Muse can read your locations, rankings, reports, and reviews. It can run credit-using scans
      and campaigns, and reply to reviews.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Local Falcon. To learn more, view their [terms](https://www.localfalcon.com/terms-of-use)
    and [privacy policy](https://www.localfalcon.com/privacy-policy).
