version: 1
metadata:
  visible_in_settings: true
connector: jellypod
display_name: Jellypod
icon: jellypod
description: Work with your Jellypod podcasts and audio projects
cli:
  binary: jellypod-connector-cli
  skill: jellypod
auth:
  provider: jellypod
  required: true
  mcp:
    endpoint: https://mcp.jellypod.com/mcp
    oauth:
      type: oauth
      authorization_url: https://login.jellypod.com/oauth2/authorize
      token_url: https://login.jellypod.com/oauth2/token
      token_endpoint_auth_method: none
      scope: offline_access
      cimd: true
      resource: https://mcp.jellypod.com/mcp
    tool_names:
      podcasts.read:
      - list_content
      - get_content
      - list_characters
      - list_voices
      - list_video_styles
      podcasts.modify:
      - generate_episode
      - generate_video
      - generate_short
      - save_podcast
      - save_character
      - update_content
      - set_episode_publication
      - submit_feedback
    protocol_version: '2025-11-25'
surrogation:
  name: jellypod
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
  - login.jellypod.com
  - mcp.jellypod.com
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  stripped:
  - credentials.refresh_token
  token_refresh:
  - path: /oauth2/token
actions:
  read:
    default: ask
    label: Read permissions
    methods:
      podcasts.read:
        label: Read podcasts, voices and jobs
        approval_policy: fresh_consent_only
  write:
    default: ask
    label: Write permissions
    methods:
      podcasts.modify:
        label: Create, edit and publish podcasts
        approval_policy: fresh_consent_only
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Jellypod
    text: Muse can read your podcasts, characters, and voices. It can create, edit, and publish episodes,
      videos, and shorts.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Jellypod. To learn more, view their [terms](https://jellypod.com/terms)
    and [privacy policy](https://jellypod.com/privacy-policy).
