version: 1
metadata:
  visible_in_settings: true
connector: meltflex
display_name: MeltFlex
icon: meltflex
description: Work on interior designs with MeltFlex
cli:
  binary: meltflex-connector-cli
  skill: meltflex
auth:
  provider: meltflex
  required: true
  mcp:
    endpoint: https://www.meltflexai.com/api/mcp
    oauth:
      type: oauth
      authorization_url: https://www.meltflexai.com/oauth/authorize
      token_url: https://www.meltflexai.com/api/oauth/token
      token_endpoint_auth_method: none
      scope: email offline_access openid
      registration_url: https://www.meltflexai.com/api/oauth/register
      resource: https://www.meltflexai.com/api/mcp
    tool_names:
      designs.read:
      - browse_presets
      - check_job
      - get_credits
      designs.create:
      - generate_interior
      - create_walkthrough
      - create_3d_furniture
    protocol_version: '2025-11-25'
surrogation:
  name: meltflex
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
  - www.meltflexai.com
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  stripped:
  - credentials.refresh_token
  token_refresh:
  - path: /api/oauth/token
actions:
  read:
    default: ask
    label: Read permissions
    methods:
      designs.read:
        label: Browse designs and check jobs and credits
        approval_policy: fresh_consent_only
  write:
    default: ask
    label: Write permissions
    methods:
      designs.create:
        label: Generate interiors, walkthroughs and furniture
        approval_policy: fresh_consent_only
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with MeltFlex AI Interior Design
    text: Muse can browse design presets and check jobs and credits. It can generate interiors, walkthroughs,
      and 3D furniture using credits.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with MeltFlex AI Interior Design. To learn more, view their [terms](https://www.meltflexai.com/terms)
    and [privacy policy](https://www.meltflexai.com/privacy).
