connector: lemonpost
version: 1
display_name: Lemonpost
icon: lemonpost
description: "Create and manage social posts, validate publishing, manage media, and read publishing results and analytics."
cli:
  binary: lemonpost-connector-cli
  skill: lemonpost
auth:
  provider: lemonpost
  required: true
  mcp:
    endpoint: https://app.lemonpost.co/api/mcp
    oauth:
      type: oauth
      authorization_url: https://app.lemonpost.co/api/auth/mcp/authorize
      token_url: https://app.lemonpost.co/api/auth/mcp/token
      token_endpoint_auth_method: none
      scope: email offline_access openid profile
      registration_url: https://app.lemonpost.co/api/auth/mcp/register
      resource: https://app.lemonpost.co
    tool_names:
      tool_create_post:
      - create_post
      tool_delete_media:
      - delete_media
      tool_delete_post:
      - delete_post
      tool_get_account:
      - get_account
      tool_get_account_health:
      - get_account_health
      tool_get_analytics_summary:
      - get_analytics_summary
      tool_get_media:
      - get_media
      tool_get_post:
      - get_post
      tool_get_post_results:
      - get_post_results
      tool_list_accounts:
      - list_accounts
      tool_list_brands:
      - list_brands
      tool_list_media:
      - list_media
      tool_list_posts:
      - list_posts
      tool_retry_post:
      - retry_post
      tool_update_post:
      - update_post
      tool_upload_media_from_url:
      - upload_media_from_url
      tool_validate_post:
      - validate_post
      tool_whoami:
      - whoami
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  write:
    label: Write permissions
    default: ask
    methods:
      tool_create_post:
        label: Create post
        approval_policy: fresh_consent_only
      tool_delete_media:
        label: Delete media
        approval_policy: fresh_consent_only
      tool_delete_post:
        label: Delete post
        approval_policy: fresh_consent_only
      tool_retry_post:
        label: Retry failed targets
        approval_policy: fresh_consent_only
      tool_update_post:
        label: Update post
        approval_policy: fresh_consent_only
      tool_upload_media_from_url:
        label: Import media from URL
        approval_policy: fresh_consent_only
  read:
    label: Read permissions
    default: ask
    methods:
      tool_get_account:
        label: Get account
        approval_policy: fresh_consent_only
      tool_get_account_health:
        label: Check account health
        approval_policy: fresh_consent_only
      tool_get_analytics_summary:
        label: Get the analytics summary
        approval_policy: fresh_consent_only
      tool_get_media:
        label: Get media
        approval_policy: fresh_consent_only
      tool_get_post:
        label: Get post
        approval_policy: fresh_consent_only
      tool_get_post_results:
        label: Get publishing results
        approval_policy: fresh_consent_only
      tool_list_accounts:
        label: List connected accounts
        approval_policy: fresh_consent_only
      tool_list_brands:
        label: List brands
        approval_policy: fresh_consent_only
      tool_list_media:
        label: List media
        approval_policy: fresh_consent_only
      tool_list_posts:
        label: List posts
        approval_policy: fresh_consent_only
      tool_validate_post:
        label: Validate post
        approval_policy: fresh_consent_only
      tool_whoami:
        label: See which account is connected
        approval_policy: fresh_consent_only
surrogation:
  name: lemonpost
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - app.lemonpost.co
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /api/auth/mcp/token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Lemonpost
    text: Muse can read your brands, social accounts, posts, media, and analytics. It can create, schedule,
      or delete posts and media.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Lemonpost. To learn more, view their [terms](https://lemonpost.co/terms)
    and [privacy policy](https://lemonpost.co/privacy).
