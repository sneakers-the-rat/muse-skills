version: 1
metadata:
  visible_in_settings: true
connector: runway_mcp
category: productivity
display_name: Runway
icon: runway
description: Generate video and images and run workflows with Runway
cli:
  binary: runway-mcp
  skill: runway_mcp
auth:
  provider: runway_mcp
  required: true
  mcp:
    endpoint: https://mcp.runwayml.com/mcp
    oauth:
      type: oauth
      authorization_url: https://mcp.runwayml.com/authorize
      token_url: https://mcp.runwayml.com/token
      registration_url: https://mcp.runwayml.com/register
      resource: https://mcp.runwayml.com/mcp
      token_endpoint_auth_method: none
      scope: api:read_write
    tool_names:
      media.read:
      - list_workflows
      - get_workflow
      - get_task
      - list_recent
      - whoami
      - list_workspaces
      - show_plans_and_credits
      media.modify:
      - generate_image
      - generate_video
      - edit_video
      - expand_video
      - generate_multishot_video
      - generate_product_marketing_video
      - localize_ad
      - generate_music
      - generate_sound_effect
      - generate_speech
      - remove_image_background
      - remove_video_background
      - upscale_image
      - upscale_video
      - convert_video_to_hdr
      - run_workflow
      - init_upload
      - complete_upload
      workflows.modify:
      - create_workflow
      - save_workflow_version
      - validate_workflow_graph
surrogation:
  name: runway_mcp
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
    - mcp.runwayml.com
  token_proxy:
    - field: credentials.access_token
      placement: bearer_header
  stripped:
    - credentials.refresh_token
  token_refresh:
    - path: /token
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      media.read:
        label: Read media, workflows and credit balance
  write:
    default: ask
    label: Write permissions
    methods:
      media.modify:
        label: Generate and edit media
        approval_policy: fresh_consent_only
      workflows.modify:
        label: Create, edit and validate workflows
        approval_policy: fresh_consent_only
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Runway
    text: Muse will access things like prompts, generated videos and images, and uploaded assets.
  - icon: info
    title: You choose what Muse can do
    text: Muse can read information for your tasks. It will ask each time before making changes or running
      other actions. Disconnect at any time in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Runway. To learn more, view their [terms](https://runway.com/terms-of-use) and [privacy policy](https://runway.com/privacy-policy).
