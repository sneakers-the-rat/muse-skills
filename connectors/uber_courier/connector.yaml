id: uber_courier
title: "Uber (Courier)"
description: "Estimate, book, track and cancel Uber Courier deliveries using your Uber account."
aliases: [uber_courier]
include_in_prompt: true
availability:
  gk: hatch_uber_courier_enabled
  # Off until a CVM launch adds the CVM consent callout with non_confidential,
  # gives the CAGI TEE gateway the Uber client secret, and removes the worker's
  # NonConfidentialOnly in spawnd's privsep_registry/tools.rs.
  confidential_vm: false
auth:
  authorize: cli
