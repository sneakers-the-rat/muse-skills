version: 1
gating:
  allowed_countries: [US, CA]
metadata:
  visible_in_settings: true
auth:
  provider: uber_courier
  client_id: "5i9EIAVDy1k7OOG5zGT2fNaOqcxoDI8S"
  required: true
  authorization_query:
    prompt: consent
cli:
  binary: uber-courier
  skill: uber_courier
connector: uber_courier
display_name: Uber (Courier)
description: Send and receive items with Uber Courier service, and use other Uber services as they become available
icon: uber_courier
request_quota:
  mode: enforce
  workers: [uber-courier]
  queries_per_minute: 60
  burst: 10
actions:
  read:
    default: allow
    label: Read permissions
    response_guard: verification_codes
    methods:
      deliveries.manage:
        label: Access Courier delivery details
        approval_phrase: manage your Uber Courier delivery
  write:
    default: ask
    label: Write permissions
    response_guard: verification_codes
    methods:
      orders.create:
        label: Request and pay for Courier delivery
        approval_phrase: book and pay for this Uber Courier delivery
        approval_policy: fresh_consent_only
commands:
  status: null
  profile: deliveries.manage
  authorize-url: null
  exchange-code: null
  refresh: null
  disconnect: null
  payment-summary: deliveries.manage
  estimate: deliveries.manage
  get-order: deliveries.manage
  cancellation-estimate: deliveries.manage
  track-order: deliveries.manage
  create-order: orders.create
  cancel-order: deliveries.manage
consent_screen:
  bullets:
    - icon: data_types
      title: "Connect with Uber"
      text: "Muse will access things like your profile information and saved payment methods to request Courier delivery."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Uber. To learn more, view their [terms](https://www.uber.com/legal/en/document/?name=general-terms-of-use&country=united-states&lang=en) and [privacy policy](https://www.uber.com/legal/en/document/?name=privacy-notice&country=united-states&lang=en)."
