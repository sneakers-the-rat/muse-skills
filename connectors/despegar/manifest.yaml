version: 1
gating:
  allowed_countries:
    default: [MX]
    exempt_vm_channels: [prod, quail, canary, internal-test, external-connectors-test]
metadata:
  visible_in_settings: true
auth:
  provider: despegar
  required: true
  mcp:
    protocol_version: "2026-07-28"
    persistent_session: false
    cagi:
      path: /mcp
    tool_names:
      flight.search: [flight-search]
      flight.flexible_search: [flight-flexible-search]
      flight.price_trend: [flight-price-trend]
      flight.deals: [flight-deals]
      flight.checkout: [execute-product-action]
cli:
  binary: despegar
  skill: despegar
connector: despegar
display_name: Despegar
icon: despegar
description: Search and compare flight itineraries, flexible dates, monthly price trends and destination deals.
request_quota:
  mode: enforce
  workers: [despegar]
  queries_per_minute: 30
  burst: 10
actions:
  read:
    default: allow
    label: Read
    response_guard: verification_codes
    methods:
      flight.search:
        label: Search flights
        approval_phrase: search Despegar flights
      flight.flexible_search:
        label: Search flexible flights
        approval_phrase: search flexible Despegar flights
      flight.price_trend:
        label: Read flight price trends
        approval_phrase: read Despegar flight price trends
      flight.deals:
        label: Search flight deals
        approval_phrase: search Despegar flight deals
  write:
    default: ask
    label: Generate checkout links
    response_guard: verification_codes
    methods:
      flight.checkout:
        default: allow
        label: Generate a selected-flight checkout link
        approval_phrase: generate a checkout link for this flight on Despegar
        # Generates a continuation record only; no booking, payment or trip change.
        approval_policy: default
consent_screen:
  bullets:
    - icon: data_types
      title: "Search flights on Despegar"
      text: "Muse sends the route, dates, and traveler count needed for your search."
    - icon: info
      title: "Search and compare flights"
      text: "Muse can search and compare flight itineraries. Muse cannot itself book, pay, cancel, or change the trip."
    - icon: caution
      title: "Prices can change"
      text: "Availability and fares are search-time snapshots and can change."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Despegar. To learn more, view their [terms](https://www.despegar.com.mx/legales/terminos-y-condiciones) and [privacy policy](https://www.despegar.com.mx/legales/politicas-de-privacidad)."
