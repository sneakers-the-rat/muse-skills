version: 1
metadata:
  visible_in_settings: true
connector: readwise_mcp
category: productivity
display_name: Readwise
icon: readwise
description: Work with your Readwise highlights and reading library
cli:
  binary: readwise-mcp
  skill: readwise_mcp
auth:
  provider: readwise_mcp
  required: true
  mcp:
    endpoint: https://mcp2.readwise.io/mcp
    oauth:
      type: oauth
      authorization_url: https://readwise.io/o/authorize/
      token_url: https://readwise.io/o/token/
      registration_url: https://readwise.io/o/register/
      resource: https://mcp2.readwise.io/mcp
      token_endpoint_auth_method: none
      revoke_url: https://readwise.io/o/revoke-token/
      scope: openid read write
    tool_names:
      library.read:
      - readwise_search_highlights
      - readwise_list_highlights
      - readwise_get_daily_review
      - reader_search_documents
      - reader_list_documents
      - reader_get_document_details
      - reader_get_export_documents_status
      - reader_list_tags
      - reader_get_document_highlights
      library.modify:
      - readwise_create_highlights
      - readwise_update_highlight
      - readwise_delete_highlight
      - reader_create_document
      - reader_move_documents
      - reader_bulk_edit_document_metadata
      - reader_export_documents
      - reader_add_tags_to_document
      - reader_remove_tags_from_document
      - reader_create_highlight
      - reader_add_tags_to_highlight
      - reader_remove_tags_from_highlight
      - reader_set_highlight_notes
surrogation:
  name: readwise_mcp
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
  - mcp2.readwise.io
  - readwise.io
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  stripped:
  - credentials.refresh_token
  token_refresh:
  - path: /o/token/
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      library.read:
        label: Read saved documents and highlights
  write:
    default: ask
    label: Write permissions
    methods:
      library.modify:
        label: Save, edit and delete library content
        approval_policy: fresh_consent_only
consent_screen:
  bullets:
  - icon: data_types
    title: Connect to Readwise
    text: Work with your Readwise highlights and reading library.
  - icon: info
    title: You choose what Muse can do
    text: Muse can read information for your tasks. It will ask each time before making changes or running
      other actions. Disconnect at any time in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Readwise. To learn more, view their [terms](https://readwise.io/tos) and [privacy policy](https://readwise.io/privacy).
