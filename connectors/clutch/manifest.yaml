connector: clutch
version: 1
display_name: Clutch
icon: clutch
description: "Find B2B service providers, read reviews and service packages, and message providers."
cli:
  binary: clutch-connector-cli
  skill: clutch
auth:
  provider: clutch
  required: true
  mcp:
    endpoint: https://bot.clutch.co/mcp
    oauth:
      type: oauth
      authorization_url: https://account.clutch.co/oauth2/v1/authorize
      token_url: https://account.clutch.co/oauth2/v1/token
      token_endpoint_auth_method: none
      scope: profile
      registration_url: https://account.clutch.co/oauth2/v1/register
      resource: https://bot.clutch.co/mcp
    tool_names:
      tool_get_provider_info:
      - get_provider_info
      tool_get_service_packages:
      - get_service_packages
      tool_get_service_provider_reviews:
      - get_service_provider_reviews
      tool_recommend_service_providers:
      - recommend_service_providers
      tool_send_message_to_provider:
      - send_message_to_provider
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  read:
    label: Read permissions
    default: ask
    methods:
      tool_get_provider_info:
        label: Get provider info
        approval_policy: fresh_consent_only
      tool_get_service_packages:
        label: List service packages
        approval_policy: fresh_consent_only
      tool_get_service_provider_reviews:
        label: Get service provider's reviews
        approval_policy: fresh_consent_only
      tool_recommend_service_providers:
        label: Recommend service providers
        approval_policy: fresh_consent_only
  write:
    label: Write permissions
    default: ask
    methods:
      tool_send_message_to_provider:
        label: Send message to service providers
        approval_policy: fresh_consent_only
surrogation:
  name: clutch
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - account.clutch.co
  - bot.clutch.co
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /oauth2/v1/token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Clutch
    text: Muse can search providers and read their profiles, reviews, and packages. It can message providers
      for you.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Clutch. To learn more, view their [terms](https://clutch.co/terms) and
    [privacy policy](https://clutch.co/privacy).
