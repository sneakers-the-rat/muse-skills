version: 1
gating:
  allowed_countries: [JP, SG]
metadata:
  visible_in_settings: true
auth:
  provider: agoda
  required: true
connector: agoda
display_name: Agoda
icon: agoda
description: Search Agoda for stays, flights, and activities
request_quota:
  mode: shadow
  workers: [agoda]
  queries_per_minute: 20
  burst: 5
cli:
  binary: agoda
  skill: agoda
  service: agoda
declarable_scopes: []
actions:
  read:
    default: allow
    label: Read permissions
    response_guard: verification_codes
    methods:
      travel.search:
        label: Search stays, flights, and activities
        approval_phrase: search stays, flights, and activities on Agoda
commands:
  status: null
  disconnect: null
  search: travel.search
consent_screen:
  bullets:
    - icon: data_types
      title: "Plan trips with Agoda"
      text: "Muse can search Agoda for places to stay, flights, and activities, and compare prices and reviews."
    - icon: info
      title: "Booking stays with Agoda"
      text: "Muse shares the trip details you ask about, such as destination, dates, travellers, and budget, with Agoda. Muse can share an Agoda link, but it cannot book or pay through this connector."
    - icon: caution
      title: "Check before you book"
      text: "Prices and availability can change. Confirm the details on Agoda before booking."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Agoda. To learn more, view their [terms](https://www.agoda.com/info/termsofuse.html) and [privacy policy](https://www.agoda.com/info/privacy.html)."
