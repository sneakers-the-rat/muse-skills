surrogation:
  name: wavelength
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - mcp.wavelengthflow.com
  - wavelengthflow.com
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Wavelength
    text: Muse can read, edit, publish, or delete flows, manage collaborators, change organization settings,
      or permanently delete an organization.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Wavelength. To learn more, view their [terms](https://wavelengthflow.com/terms)
    and [privacy policy](https://wavelengthflow.com/privacy.html).
