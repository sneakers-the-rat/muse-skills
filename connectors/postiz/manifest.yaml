connector: postiz
version: 1
display_name: Postiz
icon: postiz
description: "Draft, schedule and publish social posts, upload or generate media, and turn long videos into short captioned clips."
cli:
  binary: postiz-connector-cli
  skill: postiz
auth:
  provider: postiz
  required: true
  mcp:
    endpoint: https://mcp.postiz.com/mcp-oauth-dynamic
    oauth:
      type: oauth
      authorization_url: https://platform.postiz.com/oauth/authorize
      token_url: https://api.postiz.com/oauth/token
      token_endpoint_auth_method: none
      scope: mcp:read mcp:write
      registration_url: https://api.postiz.com/oauth/register
      resource: https://mcp.postiz.com/mcp-oauth-dynamic
    tool_names:
      tool_id.636c697070696e67537461747573546f6f6c:
      - clippingStatusTool
      tool_id.636c697070696e67546f6f6c:
      - clippingTool
      tool_id.64656c657465506f7374546f6f6c:
      - deletePostTool
      tool_id.67656e6572617465496d616765546f6f6c:
      - generateImageTool
      tool_id.67656e6572617465566964656f4f7074696f6e73:
      - generateVideoOptions
      tool_id.67656e6572617465566964656f546f6f6c:
      - generateVideoTool
      tool_id.67726f75704c697374:
      - groupList
      tool_id.696e746567726174696f6e4c697374:
      - integrationList
      tool_id.696e746567726174696f6e5363686564756c65506f7374546f6f6c:
      - integrationSchedulePostTool
      tool_id.696e746567726174696f6e536368656d61:
      - integrationSchema
      tool_id.6d656469614c697374546f6f6c:
      - mediaListTool
      tool_id.6d65646961537461747573546f6f6c:
      - mediaStatusTool
      tool_id.706f737453657474696e6773546f6f6c:
      - postSettingsTool
      tool_id.706f7374734c697374546f6f6c:
      - postsListTool
      tool_id.74726967676572546f6f6c:
      - triggerTool
      tool_id.75706c6f616446726f6d55726c546f6f6c:
      - uploadFromUrlTool
      tool_id.766964656f46756e6374696f6e546f6f6c:
      - videoFunctionTool
      tool_id.766964656f537461747573546f6f6c:
      - videoStatusTool
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  read:
    label: Read permissions
    default: ask
    methods:
      tool_id.636c697070696e67537461747573546f6f6c:
        label: "Check clip creation progress"
        approval_policy: fresh_consent_only
      tool_id.67656e6572617465566964656f4f7074696f6e73:
        label: "List video generation options"
        approval_policy: fresh_consent_only
      tool_id.67726f75704c697374:
        label: "List customer groups"
        approval_policy: fresh_consent_only
      tool_id.696e746567726174696f6e4c697374:
        label: "List connected social accounts"
        approval_policy: fresh_consent_only
      tool_id.696e746567726174696f6e536368656d61:
        label: "Get platform posting requirements"
        approval_policy: fresh_consent_only
      tool_id.6d656469614c697374546f6f6c:
        label: "List images and videos in the media library"
        approval_policy: fresh_consent_only
      tool_id.6d65646961537461747573546f6f6c:
        label: "Check media preparation status"
        approval_policy: fresh_consent_only
      tool_id.706f7374734c697374546f6f6c:
        label: "List posts and their publishing status"
        approval_policy: fresh_consent_only
      tool_id.766964656f46756e6374696f6e546f6f6c:
        label: "Look up video generation details"
        approval_policy: fresh_consent_only
      tool_id.766964656f537461747573546f6f6c:
        label: "Check video generation progress"
        approval_policy: fresh_consent_only
  write:
    label: Write permissions
    default: ask
    methods:
      tool_id.636c697070696e67546f6f6c:
        label: "Create captioned clips from a YouTube video"
        approval_policy: fresh_consent_only
      tool_id.64656c657465506f7374546f6f6c:
        label: "Delete a post from Postiz"
        approval_policy: fresh_consent_only
      tool_id.67656e6572617465496d616765546f6f6c:
        label: "Generate an image for a post"
        approval_policy: fresh_consent_only
      tool_id.67656e6572617465566964656f546f6f6c:
        label: "Generate a video for a post"
        approval_policy: fresh_consent_only
      tool_id.696e746567726174696f6e5363686564756c65506f7374546f6f6c:
        label: "Draft, schedule or publish social posts"
        approval_policy: fresh_consent_only
      tool_id.706f737453657474696e6773546f6f6c:
        label: "Change platform settings for an unpublished post"
        approval_policy: fresh_consent_only
      tool_id.74726967676572546f6f6c:
        label: "Get platform posting details"
        approval_policy: fresh_consent_only
      tool_id.75706c6f616446726f6d55726c546f6f6c:
        label: "Upload media from a public URL"
        approval_policy: fresh_consent_only
surrogation:
  name: postiz
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - api.postiz.com
  - mcp.postiz.com
  - platform.postiz.com
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /oauth/token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Postiz
    text: Muse can read your social accounts, posts, and media. It can generate or upload media, schedule
      posts, and delete posts.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Postiz. To learn more, view their [terms](https://postiz.com/terms-of-service)
    and [privacy policy](https://postiz.com/privacy-policy).
