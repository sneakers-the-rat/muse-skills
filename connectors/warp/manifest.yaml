connector: warp
version: 1
display_name: Warp
icon: warp
description: "Compare freight and parcel rates, book domestic and international shipments, track deliveries, and review shipping documents and invoices."
cli:
  binary: warp-connector-cli
  skill: warp
auth:
  provider: warp
  required: true
  mcp:
    endpoint: https://mcp.wearewarp.com/api/mcp
    oauth:
      type: oauth
      authorization_url: https://mcp.wearewarp.com/authorize
      token_url: https://mcp.wearewarp.com/token
      token_endpoint_auth_method: none
      scope: warp
      registration_url: https://mcp.wearewarp.com/register
      resource: https://mcp.wearewarp.com/api/mcp
    tool_names:
      tool_analytics:
      - analytics
      tool_automate_lane:
      - automate_lane
      tool_automation_receipts:
      - automation_receipts
      tool_batch_book:
      - batch_book
      tool_batch_quote:
      - batch_quote
      tool_book:
      - book
      tool_box_truck_quote:
      - box_truck_quote
      tool_compare_freight_costs:
      - compare_freight_costs
      tool_compare_modes:
      - compare_modes
      tool_consolidate:
      - consolidate
      tool_delete_load_template:
      - delete_load_template
      tool_events:
      - events
      tool_freight_workflow:
      - freight_workflow
      tool_ftl_quote:
      - ftl_quote
      tool_get_documents:
      - get_documents
      tool_get_invoice:
      - get_invoice
      tool_international_book:
      - international_book
      tool_international_customs:
      - international_customs
      tool_international_quote:
      - international_quote
      tool_international_settings:
      - international_settings
      tool_lane_history:
      - lane_history
      tool_list_bookings:
      - list_bookings
      tool_load_templates:
      - load_templates
      tool_locations:
      - locations
      tool_ltl_market_options:
      - ltl_market_options
      tool_ltl_quote:
      - ltl_quote
      tool_manage_automation:
      - manage_automation
      tool_multistop_book:
      - multistop_book
      tool_multistop_quote:
      - multistop_quote
      tool_parcel_book:
      - parcel_book
      tool_parcel_quote:
      - parcel_quote
      tool_payment_status:
      - payment_status
      tool_price_check:
      - price_check
      tool_quote_history:
      - quote_history
      tool_report_issue:
      - report_issue
      tool_save_load_template:
      - save_load_template
      tool_shipper_profile:
      - shipper_profile
      tool_status:
      - status
      tool_track:
      - track
      tool_van_quote:
      - van_quote
    protocol_version: '2025-11-25'
metadata:
  visible_in_settings: true
actions:
  read:
    label: Read permissions
    default: ask
    methods:
      tool_analytics:
        label: Summarise shipping history
        approval_policy: fresh_consent_only
      tool_automation_receipts:
        label: Get automation authorization records
        approval_policy: fresh_consent_only
      tool_batch_quote:
        label: Batch quote lanes
        approval_policy: fresh_consent_only
      tool_box_truck_quote:
        label: Get box truck quote
        approval_policy: fresh_consent_only
      tool_compare_freight_costs:
        label: Compare freight costs against evidence
        approval_policy: fresh_consent_only
      tool_compare_modes:
        label: Compare freight modes
        approval_policy: fresh_consent_only
      tool_consolidate:
        label: Find consolidation savings
        approval_policy: fresh_consent_only
      tool_events:
        label: Get shipment events
        approval_policy: fresh_consent_only
      tool_freight_workflow:
        label: Start a freight review
        approval_policy: fresh_consent_only
      tool_ftl_quote:
        label: Get full truckload quote
        approval_policy: fresh_consent_only
      tool_get_documents:
        label: Get shipment documents
        approval_policy: fresh_consent_only
      tool_get_invoice:
        label: Get invoice
        approval_policy: fresh_consent_only
      tool_international_quote:
        label: Get international rates (Air / Ocean)
        approval_policy: fresh_consent_only
      tool_international_settings:
        label: Get international shipping settings
        approval_policy: fresh_consent_only
      tool_lane_history:
        label: View lane history
        approval_policy: fresh_consent_only
      tool_list_bookings:
        label: List bookings
        approval_policy: fresh_consent_only
      tool_load_templates:
        label: List load templates
        approval_policy: fresh_consent_only
      tool_locations:
        label: List saved locations
        approval_policy: fresh_consent_only
      tool_ltl_market_options:
        label: Compare LTL carriers
        approval_policy: fresh_consent_only
      tool_ltl_quote:
        label: Get LTL freight quote
        approval_policy: fresh_consent_only
      tool_multistop_quote:
        label: Get multi-stop FTL quote
        approval_policy: fresh_consent_only
      tool_parcel_quote:
        label: Get parcel rates (FedEx)
        approval_policy: fresh_consent_only
      tool_payment_status:
        label: Check payment status
        approval_policy: fresh_consent_only
      tool_price_check:
        label: Check price against history
        approval_policy: fresh_consent_only
      tool_quote_history:
        label: View quote history
        approval_policy: fresh_consent_only
      tool_status:
        label: Check API status
        approval_policy: fresh_consent_only
      tool_track:
        label: Track shipment
        approval_policy: fresh_consent_only
      tool_van_quote:
        label: Get cargo van quote
        approval_policy: fresh_consent_only
  write:
    label: Write permissions
    default: ask
    methods:
      tool_automate_lane:
        label: Automate a recurring lane
        approval_policy: fresh_consent_only
      tool_batch_book:
        label: Batch book shipments
        approval_policy: fresh_consent_only
      tool_book:
        label: Book shipment
        approval_policy: fresh_consent_only
      tool_delete_load_template:
        label: Delete load template
        approval_policy: fresh_consent_only
      tool_international_book:
        label: Book international (Air / Ocean)
        approval_policy: fresh_consent_only
      tool_international_customs:
        label: Read or add customs data for an international order
        approval_policy: fresh_consent_only
      tool_manage_automation:
        label: Manage an automation
        approval_policy: fresh_consent_only
      tool_multistop_book:
        label: Book multi-stop FTL
        approval_policy: fresh_consent_only
      tool_parcel_book:
        label: Book parcel (FedEx)
        approval_policy: fresh_consent_only
      tool_report_issue:
        label: Report a problem to Warp
        approval_policy: fresh_consent_only
      tool_save_load_template:
        label: Save load template
        approval_policy: fresh_consent_only
      tool_shipper_profile:
        label: Read or update the shipper profile
        approval_policy: fresh_consent_only
surrogation:
  name: warp
  mode: direct_oauth
  privsep: true
  schema: oauth
  hosts:
  - mcp.wearewarp.com
  stripped:
  - credentials.refresh_token
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  token_refresh:
  - path: /token
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Warp
    text: Muse can read your shipments, quotes, tracking, and invoices. It can book shipments, including
      recurring bookings charged automatically.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - The info used for your tasks is part of your interactions with Muse, which we may use to improve AI
    at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)
  - Muse will exchange info with Warp. To learn more, view their [terms](https://mcp.wearewarp.com/terms)
    and [privacy policy](https://mcp.wearewarp.com/privacy).
