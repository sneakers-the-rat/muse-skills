version: 1
metadata:
  visible_in_settings: true
auth:
  provider: instagram
  required: true
cli:
  binary: instagram-cli
  skill: instagram
connector: instagram
category: social
display_name: Instagram
description: Catch up on friends and the creators you love
icon: instagram
request_quota:
  mode: shadow
  workers:
    - instagram-cli
    - instagram-messages-cli
  queries_per_minute: 600
  burst: 100
# Tool-variant labels for runtime telemetry. The connect and disconnect URL
# helpers run before the tool pipeline and are not listed.
cli_subcommands:
  - "accounts"
  - "help"
  - "profile"
  - "posts"
  - "feed"
  - "user-profile"
  - "tagged-posts"
  - "post"
  - "saved-posts"
  - "own-stories"
  - "own-stories-archive"
  - "stories-tray"
  - "story-media"
  - "account-search"
  - "location-search"
  - "media-understanding"
  - "engagement-sync"
  - "followers"
  - "following"
  - "close-friends"
  - "activity-notifications"
  - "fetch-post-comments"
  - "fetch-post-likers"
  - "recently-liked-posts"
  - "recently-commented-posts"
  - "account-insights"
  - "saved-collections"
  - "analytics-metric-metadata"
  - "analytics-account-insights"
  - "individual-post-insights"
  - "analytics-top-post"
  - "analytics-follower-count-delta"
  - "analytics-metric-cards"
  - "current-interests"
  - "create-interest"
  - "update-interest"
  - "delete-interest"
  - "update-interests"
  - "post-feed"
  - "post-story"
  - "edit-post"
  - "comment-reply"
  - "archive-post"
  - "hide-comment"
  - "update-post-setting"
  - "create-saved-collection"
  - "rename-saved-collection"
  - "save-post"
  - "unsave-post"
  - "set-profile-picture"
  - "update-bio"
  - "profile-banner"
  - "rename-highlight"
  - "mute-user"
# The `account-insights` command is keyed to interactions.read but returns the
# account-level insight metrics "Access analytics" (analytics.read) governs, so
# interactions.read is an account-insights DATA CLASS emitter. While analytics
# is deny/ask, Sentinel attaches an exclusion constraint and the trusted worker
# refuses the account-insights command; other interaction reads (followers,
# comments, likes) carry no insight metrics and proceed.
data_classes:
  account_insights:
    governed_by: analytics.read
    emitted_by:
      - interactions.read
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      content.read:
        label: Access content
        approval_phrase: access content on Instagram
      interactions.read:
        label: Access followers, comments, likes, and insights
        approval_phrase: access your followers, comments, likes, and insights on Instagram
      analytics.read:
        label: Access analytics
        approval_phrase: access Instagram analytics
      algorithm.read:
        label: Access your algorithm
        approval_phrase: access your Instagram algorithm
  write:
    default: ask
    label: Write and delete permissions
    methods:
      profile.edit:
        approval_policy: fresh_consent_or_task_allow
        label: Edit your profile
        approval_phrase: edit your Instagram profile
        approval_button_variants:
          edit_picture:
            approval_phrase: update your Instagram profile picture
            allow_once: Edit picture
            deny: "Don't change"
            deny.task: "Don't change"
          edit_bio:
            approval_phrase: update your Instagram bio
            allow_once: Edit bio
            deny: "Don't change"
            deny.task: "Don't change"
          clear_bio:
            approval_phrase: clear your Instagram bio
            allow_once: Clear bio
            deny: "Don't change"
            deny.task: "Don't change"
          add_link:
            approval_phrase: add a link to your Instagram profile
            allow_once: Add link
            deny: "Don't change"
            deny.task: "Don't change"
          edit_link:
            approval_phrase: update a link on your Instagram profile
            allow_once: Edit link
            deny: "Don't change"
            deny.task: "Don't change"
          add_banner:
            approval_phrase: add the Muse banner to your Instagram profile
            allow_once: Add banner
            deny: "Don't change"
            deny.task: "Don't change"
          remove_banner:
            approval_phrase: remove the Muse banner from your Instagram profile
            allow_once: Remove banner
            deny: "Don't change"
            deny.task: "Don't change"
          rename_highlight:
            approval_phrase: rename this Instagram highlight
            allow_once: Rename highlight
            deny: "Don't change"
            deny.task: "Don't change"
          clear_highlight:
            approval_phrase: clear this Instagram highlight's title
            allow_once: Clear title
            deny: "Don't change"
            deny.task: "Don't change"
      algorithm.update:
        default: allow
        label: Edit your algorithm
        approval_phrase: update your Instagram algorithm
        approval_button_variants:
          see_more:
            allow_once: See more
            deny: "Don't change"
            deny.task: "Don't change"
          see_less:
            allow_once: See less
            deny: "Don't change"
            deny.task: "Don't change"
          remove_preference:
            allow_once: Remove topic preference
            deny: "Don't change"
            deny.task: "Don't change"
      content.post:
        approval_policy: fresh_consent_or_task_allow
        label: Post and edit content
        approval_phrase: post or edit your content on Instagram
        approval_button_variants:
          post_photo:
            approval_phrase: post this photo on Instagram
            allow_once: Post photo
            deny: "Don't post"
            deny.task: "Don't post"
          post_carousel:
            approval_phrase: post this carousel on Instagram
            allow_once: Post carousel
            deny: "Don't post"
            deny.task: "Don't post"
          post_reel:
            approval_phrase: share this reel to your Instagram feed and profile
            allow_once: Share reel
            deny: "Don't post"
            deny.task: "Don't post"
          post_story:
            approval_phrase: post this story on Instagram
            allow_once: Post to story
            deny: "Don't post"
            deny.task: "Don't post"
          schedule_post:
            approval_phrase: schedule this Instagram post
            allow_once: Schedule post
            deny: "Don't post"
            deny.task: "Don't post"
          schedule_story:
            approval_phrase: schedule this Instagram story
            allow_once: Schedule story
            deny: "Don't post"
            deny.task: "Don't post"
          archive:
            approval_phrase: archive this content on Instagram
            allow_once: Archive items
            deny: "Don't archive"
            deny.task: "Don't archive"
          hide_comment:
            approval_phrase: hide this Instagram comment
            allow_once: Hide comment
            deny: "Don't change"
            deny.task: "Don't change"
          unhide_comment:
            approval_phrase: unhide this Instagram comment
            allow_once: Unhide comment
            deny: "Don't change"
            deny.task: "Don't change"
          reply:
            approval_phrase: post this public reply on Instagram
            allow_once: Post reply
            deny: "Don't reply"
            deny.task: "Don't reply"
          enable_comments:
            approval_phrase: turn on comments on this Instagram post
            allow_once: Turn on comments
            deny: "Don't change"
            deny.task: "Don't change"
          disable_comments:
            approval_phrase: turn off comments on this Instagram post
            allow_once: Turn off comments
            deny: "Don't change"
            deny.task: "Don't change"
          hide_share_count:
            approval_phrase: hide the share count on this Instagram post
            allow_once: Hide share count
            deny: "Don't change"
            deny.task: "Don't change"
          show_share_count:
            approval_phrase: show the share count on this Instagram post
            allow_once: Show share count
            deny: "Don't change"
            deny.task: "Don't change"
      settings.edit:
        # Account settings such as muting change what the user sees; reusable consent stays task-scoped.
        approval_policy: fresh_consent_or_task_allow
        label: Change your settings
        approval_phrase: change your Instagram settings
        approval_button_variants:
          mute_posts:
            approval_phrase: mute posts from this Instagram account
            allow_once: Mute posts
            deny: "Don't change"
            deny.task: "Don't change"
          unmute_posts:
            approval_phrase: unmute posts from this Instagram account
            allow_once: Unmute posts
            deny: "Don't change"
            deny.task: "Don't change"
          mute_stories:
            approval_phrase: mute stories from this Instagram account
            allow_once: Mute stories
            deny: "Don't change"
            deny.task: "Don't change"
          unmute_stories:
            approval_phrase: unmute stories from this Instagram account
            allow_once: Unmute stories
            deny: "Don't change"
            deny.task: "Don't change"
      saved.write:
        default: allow
        label: Manage saved posts
        approval_phrase: manage your saved posts on Instagram
        approval_button_variants:
          save:
            allow_once: Save
            deny: "Don't change"
            deny.task: "Don't change"
          remove_from_collection:
            allow_once: Remove from collection
            deny: "Don't change"
            deny.task: "Don't change"
          create_collection:
            allow_once: Create collection
            deny: "Don't change"
            deny.task: "Don't change"
          rename_collection:
            allow_once: Rename collection
            deny: "Don't change"
            deny.task: "Don't change"
commands:
  # Credential-free URL helpers handled by the binary before the tool pipeline.
  connect-url: null
  disconnect-url: null
  # Account discovery; not policy-gated.
  accounts: null
  # Service command catalog with no account data; not policy-gated.
  help: null
  profile: content.read
  mute-user: settings.edit
  rename-highlight: profile.edit
  posts: content.read
  feed: content.read
  user-profile: content.read
  tagged-posts: content.read
  post: content.read
  saved-posts: content.read
  own-stories: content.read
  own-stories-archive: content.read
  stories-tray: content.read
  story-media: content.read
  account-search: content.read
  location-search: content.read
  media-understanding: content.read
  followers: interactions.read
  following: interactions.read
  close-friends: interactions.read
  activity-notifications: interactions.read
  fetch-post-comments: interactions.read
  fetch-post-likers: interactions.read
  recently-liked-posts: interactions.read
  recently-commented-posts: interactions.read
  account-insights: interactions.read
  saved-collections: interactions.read
  analytics-metric-metadata: analytics.read
  analytics-account-insights: analytics.read
  individual-post-insights: analytics.read
  analytics-top-post: analytics.read
  analytics-follower-count-delta: analytics.read
  analytics-metric-cards: analytics.read
  current-interests: algorithm.read
  create-interest: algorithm.update
  update-interest: algorithm.update
  delete-interest: algorithm.update
  update-interests: algorithm.update
  post-feed: content.post
  post-story: content.post
  edit-post: content.post
  archive-post: content.post
  hide-comment: content.post
  comment-reply: content.post
  create-saved-collection: saved.write
  rename-saved-collection: saved.write
  save-post: saved.write
  unsave-post: saved.write
  set-profile-picture: profile.edit
  update-bio: profile.edit
  profile-banner: profile.edit
  update-post-setting: content.post

# The daemon sends this screen only on a confidential VM, the only place
# Instagram needs consent (auth.confidential_vm_consent in connector.yaml).
consent_screen:
  bullets:
    - icon: data_types
      title: "Level up with Instagram"
      text: "Muse will access things like your Instagram feed and followers."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  callout_title: "Non-confidential connector"
  footer_paragraphs:
    - text: "Instagram is from Meta. This means the info exchanged is visible to Meta. [Learn more](https://muse.ai/privacy)"
      placement: callout
    - "Muse will exchange info with Instagram. To learn more, view Meta's [terms](https://www.facebook.com/terms/) and [privacy policy](https://www.facebook.com/privacy/policy/)."
