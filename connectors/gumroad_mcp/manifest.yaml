version: 1
metadata:
  visible_in_settings: true
connector: gumroad_mcp
category: productivity
display_name: "Gumroad"
icon: gumroad
description: "Review your Gumroad products, sales and payouts"
cli:
  binary: gumroad-mcp
  skill: gumroad_mcp
auth:
  provider: gumroad_mcp
  required: true
  mcp:
    endpoint: "https://gumroad.com/muse/v1/mcp"
    oauth:
      type: "oauth"
      authorization_url: "https://gumroad.com/muse/v1/oauth2/authorize"
      token_url: "https://gumroad.com/muse/v1/oauth2/token"
      registration_url: "https://gumroad.com/muse/v1/oauth2/register"
      resource: "https://gumroad.com/muse/v1/mcp"
      token_endpoint_auth_method: "none"
surrogation:
  name: gumroad_mcp
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
    - gumroad.com
  token_proxy:
    - field: credentials.access_token
      placement: bearer_header
  stripped:
    - credentials.refresh_token
  token_refresh:
    - path: /muse/v1/oauth2/token
declarable_scopes:
  - view_sales
actions:
  read:
    default: allow
    label: "Read permissions"
    response_guard: verification_codes
    methods:
      get_account:
        label: "Get account"
      list_products:
        label: "List products"
      get_product:
        label: "Get product"
      list_sales:
        label: "List sales"
        requires_scopes:
          - view_sales
      list_payouts:
        label: "List payouts"
  write:
    default: ask
    label: "Write permissions"
    response_guard: verification_codes
    methods:
      create_draft_product:
        label: "Create draft product"
        approval_phrase: "create draft product in Gumroad"
      publish_product:
        label: "Publish product"
        approval_phrase: "publish product in Gumroad"
      unpublish_product:
        label: "Unpublish product"
        approval_phrase: "unpublish product in Gumroad"
consent_screen:
  bullets:
    - icon: data_types
      title: "Level up with Gumroad"
      text: "Muse will access things like products, sales, and customers."
    - icon: info
      title: "You choose what Muse can do"
      text: "By default, Muse will ask before taking actions it thinks need review. Disconnect at any time in Settings."
    - icon: caution
      title: "Keep an eye on things"
      text: "Muse may take unexpected actions. Monitor it carefully."
  footer_paragraphs:
    - "The info used for your tasks is part of your interactions with Muse, which we may use to improve AI at Meta. You can manage this in Settings. [Learn more](https://muse.ai/privacy)"
    - "Muse will exchange info with Gumroad. To learn more, view their [terms](https://gumroad.com/terms) and [privacy policy](https://gumroad.com/privacy)."
