version: 1
gating:
  allowed_countries:
    default: [GB]
    exempt_vm_channels: [prod, quail, canary, internal-test]
metadata:
  visible_in_settings: false
auth: none
connector: ryanair
display_name: Ryanair
icon: ryanair
description: Search Ryanair fares, fare calendars, routes and airports
# Counted in requests: each command sends `initialize`,
# `notifications/initialized` and its tool call.
request_quota:
  mode: enforce
  workers: [ryanair]
  queries_per_minute: 90
  burst: 30
  queries_per_hour: 900
cli:
  binary: ryanair
  skill: ryanair
actions:
  read:
    default: allow
    label: Read permissions
    response_guard: verification_codes
    methods:
      flight.search:
        label: Search Ryanair fares, routes and airports
        approval_phrase: search Ryanair flights
commands:
  # Reports reachability without calling Ryanair; `--verify` lists its tools
  # and sends no user data.
  status: null
  search: flight.search
  calendar: flight.search
  connections: flight.search
  routes: flight.search
  airports: flight.search
