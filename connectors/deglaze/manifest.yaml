version: 1
metadata:
  visible_in_settings: true
connector: deglaze
display_name: Deglaze
icon: deglaze
description: Work with your Deglaze recipes and meal plans
cli:
  binary: deglaze-connector-cli
  skill: deglaze
auth:
  provider: deglaze
  required: true
  mcp:
    endpoint: https://mcp.deglaze.app/mcp
    oauth:
      type: oauth
      authorization_url: https://mcp.deglaze.app/authorize
      token_url: https://mcp.deglaze.app/token
      token_endpoint_auth_method: none
      scope: deglaze
      cimd: true
      resource: https://mcp.deglaze.app/mcp
    tool_names:
      kitchen.read:
      - get_user_context
      - search_recipes
      - get_recipe_details
      - get_meal_plan
      - get_cooking_history
      - get_grocery_list
      kitchen.modify:
      - update_user_preferences
      - save_discovery_recipe_to_library
      - add_recipe
      - edit_recipe
      - add_recipe_to_meal_plan
      - add_note_to_meal_plan
      - update_meal_plan_item
      - delete_meal_plan_item
      - add_recipe_to_grocery_list
      - add_grocery_list_items
      - edit_grocery_list_item
    protocol_version: '2025-11-25'
surrogation:
  name: deglaze
  schema: oauth
  mode: direct_oauth
  privsep: true
  hosts:
  - mcp.deglaze.app
  token_proxy:
  - field: credentials.access_token
    placement: bearer_header
  stripped:
  - credentials.refresh_token
  token_refresh:
  - path: /token
actions:
  read:
    default: ask
    label: Read permissions
    methods:
      kitchen.read:
        label: Read recipes, meal plans and groceries
        approval_policy: fresh_consent_only
  write:
    default: ask
    label: Write permissions
    methods:
      kitchen.modify:
        label: Manage recipes, meal plans and groceries
        approval_policy: fresh_consent_only
consent_screen:
  bullets:
  - icon: data_types
    title: Level up with Deglaze Recipes and Meal Planning
    text: Muse can read your recipes, meal plans, cooking history, and grocery list. It can add or change
      them.
  - icon: info
    title: You choose what Muse can do
    text: By default, Muse will ask before taking actions it thinks need review. Disconnect at any time
      in Settings.
  - icon: caution
    title: Keep an eye on things
    text: Muse may take unexpected actions. Monitor it carefully.
  footer_paragraphs:
  - Learn more about how we use this info in our [Privacy Policy](https://muse.ai/privacy) and [Health
    Policy](https://www.facebook.com/privacy/policies/health/).
  - Muse will exchange info with Deglaze Recipes and Meal Planning. To learn more, view their [terms](https://www.deglaze.app/terms)
    and [privacy policy](https://www.deglaze.app/privacy).
