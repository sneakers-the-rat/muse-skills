[Unit]
RequiresMountsFor=/var/lib/hatch/postgres
# The postgresql-common template asserts /etc/postgresql/18/hatch/
# postgresql.conf, the volatile per-boot directory only pg_createcluster
# writes. This instance reads the bundle-rendered tree named in ExecStart
# below instead, so reset the inherited assertion and assert the file that is
# actually read: a bundle missing it fails the start here, by name, rather
# than as an opaque server exit.
AssertPathExists=
AssertPathExists=/opt/hatch/etc/postgresql/18/hatch/postgresql.conf
# Deliberately start in parallel with com.hatch.host-path-setup.service. The
# two ExecStartPre lines below independently establish PostgreSQL's only shared
# runtime path with the same owner and mode, so waiting for the universal path
# reconciler adds latency without providing a prerequisite. RV and schema
# ordering remain explicit through RequiresMountsFor and db-cluster, which
# only does work on a fresh reliable volume (pg_createcluster) or a cluster
# still missing its pgsql_tmp redirect, and is condition-skipped, hence
# instantly ordered past, on every other boot.
After=var-lib-hatch.mount com.hatch.db-cluster.service
# Stop-only ordering: the daemon's bounded stop CHECKPOINTs and finalizes
# the resume handoff (including the epoch sidecar the post-PG-stop proof
# reads) while PostgreSQL is still up, so at stop the daemon must exit
# first; Before= reverses into exactly that. Inert at fresh boot (no RV job
# queued) and on later attach (the daemon is already active), so it never
# couples the daemon's pre-RV start to PostgreSQL.
Before=com.hatch.daemon.service
StartLimitIntervalSec=0

[Service]
Type=notify
NotifyAccess=main
User=postgres
Group=postgres
UMask=0027
Environment=PG_OOM_ADJUST_FILE=/proc/self/oom_score_adj
EnvironmentFile=${env_file}
EnvironmentFile=-${env_override_file}
ExecStartPre=+/usr/bin/install -d -m 0755 -o root -g root /run/hatch
ExecStartPre=+/usr/bin/install -d -m 0755 -o postgres -g postgres /run/hatch/postgres
# Query scratch, not state: PostgreSQL never WAL-logs or fsyncs temporary files
# and empties the directory at startup, so the data directory's pgsql_tmp is a
# symlink to this path (hatch-dbctl owns that link) to keep spills off the
# reliable volume. This path lives on storage that a reboot discards, so
# recreate it on every start rather than assuming it survived.
ExecStartPre=+/usr/bin/install -d -m 0700 -o postgres -g postgres /var/lib/hatch-postgres-temp
ExecStart=
ExecStart=${host_bin_dir}/hatch-postgres-start.sh -D /var/lib/hatch/postgres/hatch -c config_file=/opt/hatch/etc/postgresql/18/hatch/postgresql.conf
ExecStop=
# The inherited ExecReload is pg_ctlcluster, which resolves the cluster
# through the /etc/postgresql registry this instance does not keep. Reload by
# signalling the postmaster recorded in the data directory instead.
ExecReload=
ExecReload=/usr/lib/postgresql/18/bin/pg_ctl reload -D /var/lib/hatch/postgres/hatch
KillSignal=SIGINT
# Explicit stop budget: the daemon checkpoints and fast-stops PG in its own
# bounded capture path, so by the time the cascade stops this unit a SIGINT
# fast shutdown is quick; 30s keeps the end-to-end RV stop budget provable
# alongside the daemon's TimeoutStopSec=60 and the 30s mount units.
TimeoutStopSec=30
StandardOutput=journal
StandardError=journal
# Keep DB priority at the slice boundary. PostgreSQL is the only member today,
# so per-service CPU/IO weights would duplicate hatch-db.slice policy.
Slice=hatch-db.slice
PIDFile=/run/hatch/postgres/18-hatch.pid
LimitNOFILE=65536
CPUAccounting=true
IOAccounting=true
MemoryAccounting=true
ManagedOOMPreference=avoid
Restart=on-failure
RestartSec=2s
TimeoutStartSec=30min