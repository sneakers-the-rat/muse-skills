[Unit]
# Local PostgreSQL unless this boot published remote mode. Ordered after the
# writer, so a remote boot's flag exists first; nothing depends on the writer,
# so a VM whose writer failed still starts local PostgreSQL. Kept apart from
# hatch.conf, whose changes require a cluster restart.
After=com.hatch.postgres-mode.service
ConditionPathExists=!/run/hatch/postgres-mode/remote