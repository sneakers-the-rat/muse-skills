id = "deep_research"
name = "Deep Research"
model = "session"
provider = "model_registry"
reasoning_strength = "session"
tool_loading = "full"
# Data-starved by construction, asserted at boot by
# validate_deep_research_data_starvation: no memory, chat, read, write,
# edit, exec, or spawn, so an injected page finds nothing to exfiltrate and no
# tool to persist instructions with. browser.observe, browser.act and
# browser.tabs drive the researcher's own off-the-record window on the
# research browser broker, never the user's browser (browser.act carries the
# research wording); research_notes is the ONE write surface, jailed to the
# per-mission directory (tools/research_notes.rs); finish_research is the one
# terminal return.
tools = [
    "browser.act",
    "browser.observe",
    "browser.tabs",
    "browser_open",
    "browser_search",
    "finish_research",
    "research_data",
    "research_notes",
]