# ridge.com
# This site's Cloudflare wall hard-blocks datacenter egress on sight
# (0/3 and 1/3 first-attempt checkout passes in the 2026-10-10 benchmark);
# start on the residential exit instead of burning the first attempt and a
# recovery swap. Default egress stays as the fallback for residential outages.
egress:
  - via: residential
    provider: oxylabs
  - via: default

