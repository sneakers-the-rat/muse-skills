# From the embedded default.yaml — the global browser configuration.
# Realtime is chat and side chats; background is cron, proactivity and Spaces.
# Proactivity always uses the local browser, which presents Linux.
browsers:
  realtime: [vmvm, local, client_browser]
  background: [vmvm, local]
# Personas apply only while the hatch_browser_enhanced kill switch is on; off,
# every lane presents native Linux. aa.com, ebay.com and macys.com present
# macOS on the realtime lane.
persona:
  realtime: linux
  background: windows
# Sites opt in to Web Bot Auth signing per lane, under the master Gatekeeper.
# Only Chat (realtime) and Cron (background) VMVM browsers sign; Spaces, local
# and CVM browsers never do.
web_bot_auth:
  realtime: false
  background: false
egress:
  - via: default
  - via: residential
    provider: oxylabs
