# Gap instructions

## Brands

- Gap, Old Navy and Banana Republic share this site, each on its own subdomain
  (oldnavy.gap.com, bananarepublic.gap.com). The bar across the top also links
  Gap Factory and Athleta. Stay on the brand the task names.

## Product pages

- Select colour, size and any length or fit option before “Add to Bag”, and
  verify that the selected combination is available. “Size Guide” and “Size &
  fit” explain sizing; they do not select a size.
- On category pages, “Filter & Sort” narrows by size, colour and price.

## Bag and checkout

- Inspect the bag with `browser.observe` after adding. Pressing “Add to Bag”
  again can raise the quantity even while the confirmation panel is still open.
- “Apply” submits the promotion field beside it (“Enter Promo Code”); check
  the resulting discount and total.
- “Shipping Speed” can change fees and arrival dates. “In-store pickup” needs a
  selected store.
- “Place Order” submits the order. A PayPal information link is not payment
  authorization; complete checkout through the payment workflow.

## Signing in

- Sign-in runs at `/my-account/sign-in`. The page can show only “Loading” for
  a while; wait for the form before acting.

## Bot detection

- Bot checks are occasional. When a check or block page replaces the store,
  treat it as a bot challenge.
