schema: 2
domains:
  - debenhams.com
headers:
  - name: mid-auth-debenhams
    value: "5725caa529cf9cf5f0f8fbcff6a96fa2b64638981a44cb353b8e36dad541ef1b"
    diagnostics: public
  - name: X-Personal-Agent-ID
    source: hbi_release_marker
    diagnostics: public
default.yamlschema: 2
# Realtime is chat and side chats; background is cron, proactivity and Spaces.
# Proactivity always uses the local browser, which presents Linux.
browsers:
  realtime: [vmvm, local, client_browser]
  background: [vmvm, local]
# Personas apply only while the hatch_browser_enhanced kill switch is on; off,
# every lane presents native Linux. aa.com, ebay.com, macys.com and united.com
# present macOS on the realtime lane.
persona:
  realtime: linux
  background: windows
# Sites opt in to Web Bot Auth signing per lane, under the master Gatekeeper.
# Only Chat (realtime) and Cron (background) VMVM browsers sign; Spaces, local
# and CVM browsers never do.
web_bot_auth:
  realtime: false
  background: false
egress:
  - via: default
  - via: residential
    provider: oxylabs
headers: []
