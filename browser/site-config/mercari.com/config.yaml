schema: 2
# Mercari Japan and Mercari Shops only. SKILL.md here is a temporary
# workaround: Mercari sign-in needs a passkey, which Muse's browser does not
# support, so the guide sends every sign-in step to the user's own device.
# The domains are limited to Japan so the guide does not reach Mercari US
# (www.mercari.com); the headers follow the same list, so Mercari US gets no
# partner marker. Once Mercari ships a Muse connector, remove SKILL.md and the
# Marketplaces skill's Mercari sign-in bullet.
domains:
  - jp.mercari.com
  - login.jp.mercari.com
  - mercari-shops.com
headers:
  - name: mid-auth-mercari
    value: "05df8e13c44e35762fc145b649906512ddc09a7fb3daf39eb1167db8cc75b7a4"
    diagnostics: public
  - name: X-Personal-Agent-ID
    source: hbi_release_marker
    diagnostics: public
