[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hatch-extract"
version = "0.2.0"
description = "Standing extraction of the hatch binary's embedded files and strings: one mechanism registry, one pipeline, one manifest (binary-map.json). Static analysis only: this package reads the binary, it never executes it."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hatch-extract = "hatch_extract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
