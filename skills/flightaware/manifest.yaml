version: 1
metadata:
  visible_in_settings: false
auth: none
connector: flightaware
display_name: FlightAware
icon: flightaware
description: Query FlightAware AeroAPI through Muse's server-side broker. No FlightAware credentials live on the VM.
actions:
  read:
    default: allow
    label: Read flight data
    methods:
      flight.search:
        label: Search flights
      foresight.read:
        label: Read Foresight predictions
      airport.read:
        label: Read airport metadata, delays, weather, and routes
      airport.flights.read:
        label: Read airport flight activity
      operator.read:
        label: Read operator metadata
      operator.flights.read:
        label: Read operator flight activity
      history.read:
        label: Read historical flight data
      aircraft.read:
        label: Read aircraft metadata
      schedule.read:
        label: Read scheduled flight data
      disruption.read:
        label: Read disruption counts
  write:
    default: ask
    label: Create, update, or delete FlightAware state
    methods:
      flight_intent.create:
        default: allow
        label: Create flight intents
commands:
  # Broker reachability check; --verify probes without a connector grant.
  status: null
  # Flight-ident and fa_flight_id lookups run without connector authorization.
  flight: null
  canonical-flight: null
  create-flight-intent: flight_intent.create
  position: null
  track: null
  route: null
  map: null
  search: flight.search
  search-positions: flight.search
  search-count: flight.search
  search-advanced: flight.search
  "foresight flight": foresight.read
  "foresight search-advanced": foresight.read
  "foresight position": foresight.read
  airports: airport.read
  airport: airport.read
  airport-canonical: airport.read
  nearby-airports: airport.read
  airport-delays: airport.read
  airport-flights: airport.flights.read
  airport-to: airport.flights.read
  airport-counts: airport.read
  airport-weather: airport.read
  airport-routes: airport.flights.read
  operators: operator.read
  operator: operator.read
  operator-canonical: operator.read
  operator-flights: operator.flights.read
  operator-counts: operator.read
  "history flight": history.read
  "history track": history.read
  "history map": history.read
  "history route": history.read
  "history airport-flights": history.read
  "history aircraft-last-flight": history.read
  "history operator-flights": history.read
  "aircraft blocked": aircraft.read
  "aircraft owner": aircraft.read
  "aircraft type": aircraft.read
  schedules: schedule.read
  disruptions: disruption.read
