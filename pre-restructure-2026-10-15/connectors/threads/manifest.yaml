version: 1
metadata:
  visible_in_settings: true
auth:
  provider: threads
  required: true
cli:
  binary: threads-cli
  skill: threads
connector: threads
category: social
display_name: Threads
description: Stay in the loop on trending topics and conversations.
icon: threads
request_quota:
  mode: shadow
  workers:
    - threads-cli
    - threads-messages-cli
  queries_per_minute: 600
  burst: 100
actions:
  read:
    default: allow
    label: Read permissions
    methods:
      content.read:
        label: Access content
      interactions.read:
        label: Access interactions
      algorithm.read:
        label: Access your algorithm
        approval_phrase: access your Threads algorithm
  write:
    default: ask
    label: Write and delete permissions
    methods:
      algorithm.update:
        default: allow
        label: Edit your algorithm
        approval_phrase: update your Threads algorithm
      content.post:
        approval_policy: fresh_consent_only
        label: Post content
        approval_phrase: post this content to Threads
commands:
  # Credential-free URL helpers handled by the binary before clap parsing.
  connect-url: null
  disconnect-url: null
  # Account discovery; not policy-gated.
  accounts: null
  profile: content.read
  activity-feed: content.read
  top-posts: content.read
  user-profile: content.read
  profile-threads: content.read
  profile-replies: content.read
  profile-media: content.read
  post: content.read
  trends: content.read
  search: content.read
  feed: content.read
  liked-media: interactions.read
  saved-posts: interactions.read
  insights-overview: interactions.read
  post-insights: interactions.read
  followers: interactions.read
  following: interactions.read
  fetch-post-comments: interactions.read
  fetch-post-likers: interactions.read
  feedback-hub-overview: interactions.read
  feedback-hub-tab: interactions.read
  dear-algo-whisper: algorithm.update
  # Hidden from --help, but the skill and connector docs teach it.
  publish-post: content.post
