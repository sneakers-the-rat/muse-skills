name: remember_products
title: "Remember Products"
description: "Use when the user asks you to remember or save products you showed them for later, or asks what products you remembered or saved. Keeps each product's image, name, merchant and price, and shows remembered products again as product cards without a new search, refreshing catalog products' image, name and price first."
