name: smb_product_shots
title: "Product shots"
description: "Use when the user shares a photo of something they sell or a product photo and asks to make it look better, polish, edit, clean up or touch it up for their shop, for selling, or to caption or share it on Instagram, a Facebook Page, Marketplace or their website. Load this skill before editing the photo or calling media.generate_image. Marketplace listings offer touch-ups first, even when the user only asked for the listing. Uses facebook_cli for the listing. Not for selfies or photos of people, pets or other animals, unless a person is wearing or holding an item to sell."
category: "Business"
include_in_prompt: true
availability:
  confidential_vm: false
