name: live_page_checks
title: "Price and Stock Checks"
description: "Check a product's current price, stock or availability at a known store by reading a recent copy of its product page with `browser.open` first, and start a live browser task only when that read fails, is blocked or does not settle the answer. Load it for one-time checks and when setting up or running a restock or price watch."
category: "Shopping"
include_in_prompt: true
